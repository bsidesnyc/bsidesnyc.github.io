  title: Building Cult Brands in Cybersecurity
  speakers:
  - name: Sean Sun
    company: Miscreants
    title: Founder and CEO of Miscreants
    bio: Founder and CEO of Miscreants, a cybersecurity focused creative agency.
    photo: /img/archive/2026/speakers/sean-sun.webp
  description: 'A cult brand is a company who is able to actually and consistently resonate with a specific slice of a customer''s
    identity. When this happens, the customer becomes a fan, wearing the merch and even arguing for you in threads that no
    one pays them to be in.


    In cybersecurity, with the amount of slop design and follower marketing, building a cult brand is how startups can actually
    hold their own.


    This talk is meant to be a tactical way for any founder/future founder to rethink the storytelling of their company with
    frameworks, examples, and (hopefully) an audience exercise.'
