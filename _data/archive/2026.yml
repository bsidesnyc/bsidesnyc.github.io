  title: 'No Safe Harbor: OceanLotus and ROGUEHARBOR'
  speakers:
  - name: Josh Duke
    company: Volexity
    title: Volexity, Senior Threat Intelligence Analyst
    bio: Josh is a Senior Threat Intelligence Analyst at Volexity with experience in tracking nation-state threat actors and
      infrastructure analysis, transforming findings from these investigations into defenses for customer networks. With a
      strong understanding of Computer Science, holding both a MS and BS in the field, Josh is able to connect his understanding
      of software and networking to inform his work as an intelligence analyst.
    photo: /img/archive/2026/speakers/josh-duke.webp
  description: The OceanLotus threat actor continues to target human-rights organizations with a focus on Southeast Asia,
    contacting individuals via messaging platforms like WhatsApp to send malware. The most recent campaign Volexity observed
    involved a virtual hard disk being sent to an individual of one of these organizations over WhatsApp in the guise of a
    document. When the file inside this hard disk is opened, a multi-stage infection chain begins that results in the deployment
    of a fully-featured modular RAT Volexity tracks as ROGUEHARBOR. This presentation details the targeting and infection
    chain details to provide additional insights into the recent activities of OceanLotus.
