  title: 'Identity Has A Plan: A Call To Action For Security And DevOps'
  speakers:
  - name: Dwayne McDaniel
    company: GitGuardian
    title: Developer Advocate at GitGuardian and huge fan of open source
    bio: Dwayne has been working as a Developer Relations professional since 2015 and has been involved in tech communities
      since 2005. He loves sharing his knowledge, and he has done so by giving talks at over a hundred events worldwide. Dwayne
      currently lives in Chicago. Outside of tech, he loves karaoke, live music, and performing improv.
    photo: /img/archive/2026/speakers/dwayne-mcdaniel.webp
  description: 'Security has fallen behind the pace of modern attacks. One developer installing the wrong package can put
    even well-funded teams at risk. By the time an open source infostealing worm makes headlines, it may already be inside
    your ecosystem.

    Now, AI agents are entering the picture. They are autonomous, probabilistic actors with real access to real data, and
    enterprises are pushing teams to deploy them fast. That expands the attack surface at exactly the wrong time.

    There is a practical path forward: eliminate long-lived secrets that grant standing privileges. IAM teams already have
    realistic models for this, from workload identity patterns used at Google to low-latency internal agent architectures
    at Uber.

    This talk covers supply chain infostealers, why NPM and PyPI mitigations are not enough, agentic AI as workers and customers,
    IAM basics like authentication and authorization, and how teams can move from secret rotation to real change. Security
    at human speed is over. It is time to act.'
