  title: 'IAM for AI: How Agentic Systems Break Traditional Threat Models'
  speakers:
  - name: Swati Babbar
    company: Amazon
    title: Application Security Engineer, Amazon
    bio: CISSP-certified Security Engineer with 7 years of experience in application security, vulnerability management, and
      risk reduction at scale. Focused on evolving security practices for modern, cloud-native and AI-driven systems, with
      expertise in threat modeling, system design analysis, and security architecture.
    photo: /img/archive/2026/speakers/swati-babbar.webp
  - name: Arjun Sai Ranga Katneni
    company: null
    title: Lead Security Engineer
    bio: 'Lead Security Engineer who owns SOC operations and vulnerability management at scale, spending most days thinking
      about what could go wrong so other people don''t have to.

      Background spans incident response, threat intelligence, detection engineering, machine learning security, and CI/CD
      security, with work that has included building detection systems, automating remediation, and open-sourcing a few tools
      along the way. Currently pursuing a PhD in Cyber Engineering, mostly because thinking about hard security problems during
      the day apparently wasn''t enough.

      Most interested in making security an enabler rather than a gatekeeper, whether through mentoring or better defenses.'
    photo: /img/archive/2026/speakers/arjun-sai-ranga-katneni.webp
  description: 'AI agents introduce a new security actor: software that can autonomously choose tools, call APIs, and chain
    actions to achieve goals.


    As organizations grant agents access to cloud resources, internal systems, and deployment workflows, many are treated
    like traditional service accounts. This creates excessive permissions, weak trust boundaries, and attack paths that existing
    threat models often miss.


    Through a demonstration, this session shows how prompt injection and tool abuse can manipulate an AI agent into performing
    actions beyond its intended scope—without exploiting a traditional software vulnerability.


    We''ll examine common risks in agentic AI architectures and present a practical framework for evaluating agent identities,
    permissions, trust assumptions, and autonomous decision-making.


    Attendees will leave with actionable guidance for securing AI agents, implementing least-privilege access controls, and
    adapting threat modeling practices for autonomous software.


    Key Takeaways

    • Understand why AI agents should be treated as a distinct security principal

    • Learn how prompt injection and tool abuse can lead to unauthorized actions

    • Identify common IAM anti-patterns in agentic AI deployments

    • Apply an AI-focused threat modeling framework to evaluate permissions and trust boundaries

    • Leave with practical controls that can be implemented immediately'
  type: talk
