  track: Tech - Red
  room: Tech - Red
  title: 'Weirder Machines: Compositional Attack Surfaces at the LLM-Tool Boundary'
  speakers:
  - name: Ariel Fogel
    company: Pillar Security
    title: AI Security Researcher @ Office of the CTO, Pillar Security
    bio: Ariel Fogel is a founding engineer & researcher at Pillar Security, where he hardens AI applications against real-world
      attacks and compliance risks. Over the past decade, he has built production systems in a variety of different domains,
      shipping everything from full-stack web apps to data analytics pipelines. His academic and professional research work
      spans data-science methods, learning analytics, health policy, and cybersecurity. In addition in addition to publishing
      research on a novel attack surfaces in the AI supply chain, he is an active member of the OWASP community. Among the
      initiatives he has been involved, he co-led the OWASP State of Agentic AI Security and Governance Report V2, was the
      section lead in the OWASP Securing Agentic Applications Guide V2, and is a core team member of OWASP's Agent Control
      Standard.
    photo: /img/archive/2026/speakers/ariel-fogel.webp
  - name: Eilon Cohen
    company: Pillar Security
    title: Head of Security Research @ Pillar Security
    bio: Eilon Cohen is Head of Security Research at Pillar Security, where he hunts vulnerabilities in frontier AI agents
      and orchestration platforms. His work on n8n's expression sandbox produced several critical findings, including CVE-2026-25049,
      an unauthenticated RCE rated CVSS 10.0 that exposed hundreds of thousands of enterprise AI workflows. His current research
      covers sandbox escapes, adversarial campaigns against AI infrastructure, and vulnerabilities in widely used AI assistants.
      He co-founded the AIL Community, an AI security knowledge-sharing group that has run events with Microsoft, OpenAI,
      and Nvidia. He has presented at RSAC 2025 and OWASP Global AppSec EU 2025 on ecosystem-wide supply chain vulnerabilities
      he discovered.
    photo: /img/archive/2026/speakers/eilon-cohen.webp
  description: 'The agentic-AI security debate has stalled on prompt injection. In this talk we argue that this emphasis has
    us watching the wrong boundary.

    We begin by walking through three patched cases: Cursor, Google''s Antigravity IDE, and RTK (a small CLI proxy). In Cursor''s
    strictest mode (CVE-2026-22708, CVSS 9.8), an empty allowlist and exempt shell built-ins produced zero-click code execution,
    while Antigravity''s Secure Mode kept all three of its promises even as a planted repo comment launched code. RTK involved
    no prompt injection at all: following filter rules an attacker committed to the repo, it silently stripped the backdoor
    lines from the output, so the model reasoned correctly over a filtered view and approved code it never fully saw.

    The through-line is a structural bug class we call the weirder machine, where a stochastic component upstream of a deterministic
    boundary makes its unmodeled instruction set searchable, as it did in a CVSS 10.0 RCE in Google''s Gemini CLI. Sometimes
    the model is steered, and other times it serves only as the laundering stage. We argue that the class forces a rethink
    of common defenses: output sanitizing and injection detection both fail, and the fix is to invert control policy at the
    tool boundary by allowing on argument shape, tracking config provenance, making enforcement mode-aware, and isolating
    execution. We put forward the OWASP''s new Agent Control Standard as a way to standardize the wire contract those controls
    require.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
