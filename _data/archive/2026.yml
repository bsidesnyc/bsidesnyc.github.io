  track: Tech - Blue
  room: Tech - Blue
  title: 'Verified Lies: Hunting Identity Fraud Infrastructure Behind Fake Verification Flows'
  speakers:
  - name: Andre Piazza
    company: BforeAI
    title: Cybersecurity Strategist at BforeAI
    bio: Andre Piazza is a cybersecurity strategist at BforeAI who works left of boom, catching adversary infrastructure during
      its staging window, before ransomware, account fraud, or brand and supplier impersonation reaches a target. He treats
      attacks as infrastructure and behavior rather than content, working from public signals like WHOIS, DNS, certificate
      transparency, and ASN data, and linking domains by registration velocity, shared certificate fingerprints, and hosting
      overlap to surface lookalike infrastructure before it goes live. His work spans verification fraud, impersonation built
      with AI, scams that spin up around breaking news, and operational technology. He turns published threat research into
      methods practitioners can use the next day, and he is a regular speaker at the SANS AI Cybersecurity Summit, BSides
      conferences including Seattle and Charm, Hou.Sec.Con, and Cybr.Hak.Con. He weighs the human trust attackers exploit
      as heavily as the technology.
    photo: /img/archive/2026/speakers/andre-piazza.webp
  description: 'Verification exists to answer one question: is this real? Increasingly, attackers do not answer it, they impersonate
    the question itself, cloning the login flow and staging a check that was never checking anything. I show how to hunt the
    cloned portal from public signals and pivot from one to the whole campaign.


    The lens is financial services, where verification language is a staging tell across lookalike finance domains you can
    surface yourself from certificate transparency and public newly-registered-domain feeds, before the fraud those pages
    carry. I walk two cases my team investigated: a cloned US Department of Education G5 grant portal that staged a fake /verify/
    step to harvest credentials, timed to agency disruption, and a UK retail scam riding the DragonForce intrusions that weaponized
    identity checks and reused infrastructure across brands. In both, the catchable signal lived in the infrastructure, not
    a vulnerability.


    I then show how you run the same checks with free public tools: certificate transparency, WHOIS / RDAP and ASN, and page
    tells like reused language, favicon, and script, mapped to ATT&CK so hunting a clone becomes a detection you keep. I close
    with a live read of a staged credential-harvesting page, pivoting to siblings live when they share a favicon, script,
    or certificate. You will leave able to tell verification bypass from impersonation, spot a staged portal and pivot to
    its siblings from public signals, and rerun the whole hunt on free tools.'
  type: talk
