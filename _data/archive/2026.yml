  title: 'Beyond the Flag: How CTF Players Become Product Security Engineers'
  speakers:
  - name: Monish Alur Gowdru
    company: UltraViolet Cyber
    title: Security Consultant, UltraViolet Cyber
    bio: 'Monish Alur Gowdru is a cybersecurity professional with over 6 years of experience in application security and software
      development. He enjoys helping product teams to secure applications end-to-end throughout the software development lifecycle.
      He actively contributes to the cybersecurity community as a speaker, mentor, and judge. His ongoing involvement includes
      prominent work with DEF CON and BSides Edmonton.


      LinkedIn: https://www.linkedin.com/in/ag-monish/'
    photo: /img/archive/2026/speakers/monish-alur-gowdru.webp
  - name: Mohammed Ilyas Ahmed
    company: null
    title: Making the Unachievable Achievable | Speaker | Author | Reviewer | Host | OWASP Contributor
    bio: I am a security and AI-focused technology leader with deep expertise in helping organizations build, secure, and
      govern AI-driven systems across modern, cloud-native environments. I am an active contributor to the global technology
      community and a frequent speaker at leading industry conferences. I am also regularly invited to serve as a technical
      session judge. I maintain strong ties with academia and thought leadership. I contribute research associated with Harvard
      University, publishing work that advances discussions around AI governance, modern security practices, and risk management.
      I am also a distinguished member of the Harvard Business Review Advisory Council.  My work has a global reach through
      my role as a Member of the Global Advisory Board at VigiTrust Limited (Dublin, Ireland). I am the author of Cloud-Native
      DevOps, a practical guide to building scalable, reliable, and secure cloud-native applications.
    photo: /img/archive/2026/speakers/mohammed-ilyas-ahmed.webp
  description: 'Capture The Flag competitions are often dismissed as “just games,” but modern Product Security teams increasingly
    rely on the exact skills they develop: adversarial thinking, vulnerability analysis, exploit chaining, and secure design
    under pressure.


    Whether you are an aspiring security professional or an experienced offensive security practitioner, in this session,
    you will learn a structured CTF-driven learning roadmap for developing practical security skills and will learn how hands-on,
    real-world customer-facing offensive engagements contribute to building deep product security expertise. We will also
    cover how AI capabilities are accelerating this journey of learning and securing the systems. Attendees will participate
    in a hands-on exercise to explore the challenge through the lenses of CTF problem solving, penetration testing, and Product
    Security.'
  type: talk
