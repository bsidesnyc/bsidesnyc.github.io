  title: 'Finding Signal Across AI Tooling Logs: Claude Code, Codex, Cursor, ChatGPT, and Gemini'
  speakers:
  - name: Darwin Salazar
    company: Monad
    title: Founder @ The Cybersecurity Pulse newsletter + Head of Growth at Monad
    bio: 'Darwin Salazar is the founder of The Cybersecurity Pulse, a weekly newsletter read by more than 20K people, and
      leads growth at Monad.


      He has spent nearly a decade in detection engineering, cloud security, product security, consulting, and red teaming,
      with experience at Datadog, Accenture, Johnson & Johnson, and Ford. He has presented at DEF CON and fwd:cloudsec and
      writes technical research for defenders. He loves Padel, hikes and platanos!'
    photo: /img/archive/2026/speakers/darwin-salazar.webp
  description: 'Claude Code, Codex, Cursor, ChatGPT Enterprise, and Gemini all produce security-relevant logs, but the visibility
    they provide is wildly inconsistent.


    This talk compares what each source captures, which fields are useful for investigations and detection, and where the
    logs fall short. We’ll separate control plane visibility, such as admin actions, configuration changes, and user access,
    from data plane visibility into actual tool usage, prompts, files, commands, and model interactions.


    We’ll also look at the differences between audit events and OpenTelemetry data, the context defenders often have to add
    themselves, and the assumptions that can lead teams to overestimate their coverage.


    Attendees will leave knowing which of these sources are worth collecting, what use cases each support, and where additional
    context may still be required.'
