    company: null
    title: Security Leader
    bio: Mohan is a security leader with over a decade of experience in security architecture, engineering, and operations.
      He has a strong interest in developing robust security programs and a proven track record of creating proactive security
      roadmaps and strategies aligned with business objectives. He constantly seeks ways to elevate security processes and
      culture to the next level.
    photo: /img/archive/2026/speakers/mohankumar-vengatachalam.webp
  - name: Naveen Konrajankuppam Mahavishnu
    company: null
    title: Security Researcher
    bio: 'Naveen is a Security Researcher with over 9 years of expertise specializing in AI, application, and cloud security.
      He invented 5 patents in Agentic Security space.


      He possesses extensive knowledge in all aspects of product security, including threat modeling, DevSecOps, API security,
      and penetration testing. He is passionate about integrating security into the SDLC from design to deployment, ensuring
      the early detection and mitigation of vulnerabilities.'
    photo: /img/archive/2026/speakers/naveen-konrajankuppam-mahavishnu.webp
  description: 'Three hours. Six calls. Great demo. They were not ready to buy that year. We missed the signs early.


    Naveen and I are technical founders learning how to sell. We spent our careers in security. That experience gave us credibility,
    but it did not prepare us to sell.


    The biggest shift was treating outbound as a learning engine, not a numbers game. Every silence, reply, and objection
    is data. Read what comes back, adjust the message, and try again.


    We also stopped giving every deal the same attention. Using Mark Suster’s framework, A deals can close within three months
    and get most of our time. B deals are three to 12 months away and stay warm. C deals are not happening this year, so marketing
    nurtures them while we move on. That change gave us better conversations, shorter cycles, and more time for deals that
    could actually move.


    We learned that facts alone do not carry a product story. Buyers need to feel why the problem matters now. Finding founder-operator
    mentors who had already built security companies also helped us learn faster and avoid mistakes they had already made.


    This talk is for technical founders, early startup employees, and security buyers. We will share what worked, what we
    missed, and how we now read buying intent.'
