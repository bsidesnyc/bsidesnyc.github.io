  title: 'You Cannot Govern What You Cannot See: Security Lessons for the AI Agent Era'
  speakers:
  - name: Victoria Galloway
    company: null
    title: Cybersecurity Program Leader | Identity & Access | IT/OT Convergence | Transformation Strategist
    bio: Victoria Galloway is a cybersecurity program leader focused on identity governance, privileged access management,
      and enterprise security transformation in complex environments. Her work spans IAM, PAM, governance, compliance, and
      cybersecurity program execution, with a focus on translating technical access risk into operational and executive decision-making.
      She is PMP-certified, holds a master’s degree in cybersecurity from UC Berkeley, and is passionate about helping organizations
      strengthen identity and privileged access controls as technology environments become more interconnected, automated,
      and operationally critical.
    photo: /img/archive/2026/speakers/victoria-galloway.webp
  description: 'AI agents are being introduced into business workflows before security teams fully understand what they can
    access, what actions they can take, who owns them, and how they are monitored. This talk connects AI agents to familiar
    security concepts: identity, least privilege, logging, access reviews, incident response, and accountability.'
