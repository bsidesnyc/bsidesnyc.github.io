  title: 'Frontier AI Is Compromising Evals: The Test-Takers Are Also the Attackers'
  speakers:
  - name: Leo Meyerovich
    company: Graphistry
    title: Founder & CEO, Graphistry
    bio: 'Leo Meyerovich is the founder and CEO of Graphistry and co-creator of Louie.ai, data-intensive investigation platforms
      employing AI, graphs, and GPUs that are used by teams across government, military, tech, media, and financial services
      for security, fraud, supply-chain, social media, and other investigative domains.


      Leo led development of the first autonomous AI agent to complete Splunk''s Boss of the SOC CTF and the team that won
      the U.S. Cyber Command AI RPE on alert-volume reduction. He started GFQL, the first open-source GPU-native graph query
      language for large-scale investigations, and helped start what became Apache Arrow and Nvidia RAPIDS. Graphistry spun
      out of Leo’s PhD work at UC Berkeley, where his research received two SIGPLAN Test of Time Awards and multiple best
      paper awards.'
    photo: /img/archive/2026/speakers/leo-meyerovich.webp
  description: 'Evals help determine which AI systems get deployed and trusted. Frustratingly, frontier AI has made evals
    adversarial. The system under test can autonomously use tools, execute code, inspect files and networks, retain state,
    modify its measurement environment, and is incentivized to cheat. The test-taker is now also the attacker.


    We saw this while evaluating AI agents on pre-AI investigations. As scores rose, agents gave correct answers without doing
    the intended work. They found published solutions, read leaked harness state, escaped sandboxes, and worked around firewall
    rules. We never asked them to cheat, yet each blocked path was followed by another exploit.


    This talk turns two years of cat-and-mouse experience into a threat model spanning the model, provider, harness, tools,
    workspace, benchmark, and grader. Using traces from agent speed runs of blue-team CTFs, we separate real benchmark gains
    from attacks like model contamination and evaluator leakage.


    We map these attacks to defenses like hidden and regenerating tasks and trace analysis. Likewise, we share tools like
    BotsBench for tracking performance and new failures, and our maturity model for how to approach evals, including for investigation
    agents.


    Ultimately, treat AI evals as adversarial security infrastructure, not just static AI/ML benchmarks: distrust scores by
    default, audit everything, and systematically perform defense-in-depth.'
