- time_start: '17:00'
  time_end: '17:55'
  track: Tech - Red
  room: Tech - Red
  title: 'Install Me Maybe: Turning Claimable VS Code Extension IDs into Supply-Chain Attacks'
  speakers:
  - name: Raphael Silva
    company: Aikido Security
    title: Security Researcher @ Aikido Security
    bio: Raphael Silva is a Security Researcher at Aikido Security, focused on web security, software supply-chain security,
      and vulnerability research. He has spoken at DEF CON, RootedCON, OWASP Global AppSec, Black Alps and OWASP local chapters,
      and has also run hands-on activities at DEF CON. His work centers on finding weird trust assumptions in real systems,
      turning them into clear attack models, and responsibly disclosing the results to vendors and open-source projects.
    photo: /img/archive/2026/speakers/raphael-silva.webp
  description: 'Developer tools trust extension identifiers more than they probably should.


    "Extension Confusion" is dependency confusion but for IDE extensions. A repo, devcontainer, IDE, or migration flow references
    an ID like publisher.extension. The identifier may be trusted in one marketplace, but the editor resolves it in another
    where the publisher namespace is still unclaimed. If an attacker claims it first, stale config becomes code execution
    inside a developer environment.


    I found this bug class while tracing VS Code extension IDs across the Microsoft Marketplace, Open VSX, VS Code-derived
    editors, AI IDEs, sync/import tooling, and devcontainer workflows. I will show where the trust boundary breaks, how I
    found claimable identifiers in the wild, and what happened when I published proof-of-concept extensions to measure real-world
    impact.


    The scale is what surprised me the most: 250k+ callbacks, reports to 100+ organizations, and $130k+ in bounties so far.
    I’ll show how a handful of these extensions let me hack into laptops, managed corporate machines, remote dev setups, WSL,
    and containers across SaaS, fintech, Fortune 500, healthcare, government, universities and more.


    A trusted name, a missing namespace, and the marketplace gap no one was watching.'
  type: talk
