  title: No Funding, No SOC 2, No Problem? Bootstrapping a Security Company
  speakers:
  - name: David Girvin
    company: null
    title: AI Security Researcher and Founder
    bio: Husband/Father,Hacker, Surfer, BJJ nerd, who somehow fell into AppSec and security. Focusing on breaking AI Agents
      and building solutions.
    photo: /img/archive/2026/speakers/david-girvin.webp
  description: 'We started a security company with two founders, no outside funding, and no SOC 2 report. Three things conventional
    wisdom says you need before you can sell into an enterprise. This talk is about what happens when you ignore that. What
    deals you can and can''t win without a compliance badge, how bootstrapping changes your product and sales decisions when
    you''re up against VC-backed competitors with a war chest, and why speed ended up being our only real advantage. I''ll
    get specific about the trade-offs: what we said no to, what almost killed early deals, and what I''d tell a technical
    founder about to build a security company on their own money instead of someone else''s. No fundraising-flex, no vanity
    growth metrics  just an honest account of building security software without a safety net.'
