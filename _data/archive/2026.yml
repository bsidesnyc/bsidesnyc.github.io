  title: 'Authorization phishing: phishing, but without the creds'
  speakers:
  - name: Luke Jennings
    company: Push Security
    title: VP, R&D, Push Security
    bio: Luke Jennings is a security researcher from the UK. He spent most of his early career focused on red teaming and
      offensive security research, before moving on to developing new detection and response techniques and designing EDR
      software. He has now pivoted away from the endpoint to focusing on browser and identity attacks as VP of R&D at Push
      Security and is the primary author and maintainer of the popular Browser and Identity Attacks matrix.
    photo: /img/archive/2026/speakers/luke-jennings.webp
  description: 'Credential phishing used to be simple: trick a victim into typing their password into a fake login page, then
    reuse it. Then MFA meant a password alone wasn''t enough. Attackers responded with real-time proxies to steal valid sessions
    via Attacker-in-the-Middle (AITM) phishing. Then we deployed passkeys, the "unphishable" factor, and attackers responded
    with MFA downgrade attacks against vulnerable backup methods.


    But what if attackers could convince targets to grant account access without ever touching their credentials, where MFA
    and passkeys don''t matter because the login isn''t the target at all?


    Authorization phishing is a growing class of attack abusing OAuth authorization flows rather than authentication. The
    umbrella includes consent phishing, device code phishing, and ConsentFix.

    These are being mass adopted as authentication controls mature and passkey adoption accelerates, giving attackers a technical
    and human advantage in unfamiliar phishing scenarios. Device code phishing has exploded from tiny volumes to a tier-1
    threat in early 2026, while ConsentFix was newly discovered in late 2025 after a Russia-linked campaign.


    This talk covers the history that led us here, technical details and demos of every attack, in-the-wild examples, and
    practical guidance on how organizations can prevent and detect them.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '11:30'
  time_end: '11:55'
  track: Entrepreneur
  room: Entrepreneur
  title: Building in the Age of AI Whiplash
  speakers:
  - name: Clea Ostendorf
    company: null
    title: Founder + People Connector + AppSec Fanatic
    bio: 'Clea is Wolfpack Security’s Co-Founder and CEO. She leads the company in vision and delivery and brings the ability
      to bridge tech and people into the AppSec consulting space. She has been in security and tech for 15 years playing roles
      in sales, delivery, advisory and product management. Clea loves to get to the root cause of problems and find a win-win
      solution for everyone. Wolfpack was created as a way to improve application security posture overall to ensure the products
      we use are trustworthy of our information.


      Prior to Wolfpack, Clea worked at Code42 as Field CISO where she helped build and develop data security solutions. She
      has spoken at many conferences and podcasts  including Blackhat, Open Source North, The CISO Series, Enterprise Sec
      Weekly and more. She is active in the Women in Tech communities and continues to organize events nationwide.'
    photo: /img/archive/2026/speakers/clea-ostendorf.webp
  description: 'In 2024 we started Wolfpack Security, another penetration testing company...in one of the most crowded cybersecurity
    markets imaginable. Like many startups, our challenge wasn''t building a product—it was convincing customers why another
    security consultancy deserved to exist.


    Then AI arrived. Almost overnight, the conversation shifted from "Why should we hire you?" to "Can AI replace you?" Every
    assumption about our business model was challenged.


    This talk isn''t about AI tools. It''s about what founders do when the market changes faster than their roadmap. I''ll
    share how we stopped defending our original positioning, listened to where customers were headed, and evolved from selling
    point-in-time testing to building continuous security validation around the strengths only humans provide.


    Attendees will leave with what we did to navigating rapid market shifts, making strategic pivots without abandoning their
    mission, and why trust, adaptability, and relationships become the ultimate competitive advantage when technology is changing
    every quarter.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '12:00'
  time_end: '12:55'
  track: Tech - Blue
  room: Tech - Blue
  title: '5.6 Million Domains, 400 GB of Code, Zero Alerts: How Nation-States Conduct Passive Intelligence'
  speakers:
  - name: Ringmast4r N/A
    company: null
    title: Hack The Planet
    bio: Ringmast4r is an independent security researcher and licensed PI who built a passive OSINT pipeline auditing government
      infrastructure across 73 countries. His research recovered 5.6 million domains, 400+ GB of source code, 7 million developer
      emails, and 1,986 live credentials without triggering alerts. Bloomberg and 50+ global outlets covered his findings.
      Keynote speaker at GrrCON 2026, accepted speaker at Hacker Halted 2026. M.S. in Cybersecurity Management.
    photo: /img/archive/2026/speakers/ringmast4r-n-a.webp
  description: 'What if I told you that a solo researcher with open-source tools recovered 5.6 million government domains,
    400+ gigabytes of source code, and 2.9 million developer identities across 73 countries, and triggered zero alerts? This
    talk reveals the methodology behind large-scale passive OSINT operations: how certificate logs, DNS enumeration, and git
    reconstruction expose government infrastructure at the nation-state level. Real findings include live credentials on election
    systems, military communications source code with valid authentication tokens, and supply chain vulnerabilities affecting
    critical infrastructure globally. For defenders: the clock is ticking, and you need to understand this threat model now.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '12:00'
  time_end: '12:25'
  track: Tech - Other
  room: Tech - Other
  title: 'Cleartext at the Edge: A Neptune R900 Case Study in RF Telemetry Exposure'
  speakers:
  - name: Rick Ramirez
    company: null
    title: Product security engineer and former Marine Corps radio/electronics technician researching RF telemetry exposure,
      OT/ICS security, and cyber-physical privacy risk
    bio: Rick Ramirez is a product security engineer focused on cyber-physical systems, OT/ICS security, and RF telemetry
      exposure. He has experience across product security, medical device security, manufacturing security, logistics security,
      and critical infrastructure risk assessment. Before moving into cybersecurity, Rick served as a U.S. Marine Corps radio/electronics
      technician, where he developed a foundation in RF communications, field electronics, and signal systems. His current
      research explores how overlooked wireless telemetry can expose privacy and security risks in smart infrastructure.
    photo: /img/archive/2026/speakers/rick-ramirez.webp
  description: 'Security teams are trained to think in terms of networks, endpoints, cloud systems, identity, and applications.
    But many cyber-physical systems communicate through a layer that often sits outside traditional security visibility: radio
    frequency.

    This talk presents a passive RF case study of Neptune R900 water meter telemetry and the broader security implications
    of cleartext AMR communications. Using low-cost software-defined radio tooling and receive-only observation, the research
    examines how wireless meter telemetry can expose structured data such as meter identifiers, consumption readings, status
    indicators, timestamps, and signal metadata before that data ever reaches utility-controlled systems.


    The presentation walks through the RF security model, the AMR data flow from meter endpoint to utility systems, and the
    privacy risks created when repeated cleartext telemetry becomes pattern-of-life data. It also maps the findings to a qualitative
    risk model focused on likelihood, impact, and cyber-physical context. The discussion includes responsible research boundaries,
    disclosure considerations, and recommendations for utilities, vendors, and security teams.


    Attendees will leave with a practical understanding of why RF telemetry should be treated as part of the attack surface,
    why legacy AMR design assumptions create modern privacy and trust-boundary risks, and how procurement, threat modeling,
    and architecture reviews can better account for signal-layer exposure.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
