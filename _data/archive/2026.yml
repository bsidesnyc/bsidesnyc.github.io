  title: 'Tesla Model 3''s Brain on a Desk: Getting Started with Security Research'
  speakers:
  - name: David Schütz
    company: null
    title: Security Researcher
    bio: David Schütz is a Product Security Engineer at Meta, where he works on securing the systems behind AI experiences
      on wearable devices like the Ray-Ban Meta glasses. He got his start as an independent bug bounty hunter in 2018 while
      still in high school, spending nearly five years hunting vulnerabilities across the programs of Google, Meta, and others
      -- including a $70,000 Android lock screen bypass that let anyone unlock Pixel phones without the passcode. He later
      joined Meta's Bug Bounty team, triaging researcher reports and driving vulnerabilities through incident response.
    photo: /img/archive/2026/speakers/david-schutz.webp
  description: 'What if you could buy a Tesla''s brain on eBay and boot it up on your desk? In this talk, I''ll walk through
    how I assembled a fully working Tesla Model 3 computer, MCU, autopilot board, and touchscreen, entirely from parts salvaged
    off crashed cars, and turned it into a security research rig.


    Expect live demos on a real Tesla computer sitting on stage: booting the OS, poking at the exposed network interfaces,
    and interacting with the car''s services in real time to demonstrate the attack surfaces an adversary could target.


    You''ll leave knowing how to build your own affordable car-hacking lab from salvage parts, and a practical map of where
    to start looking once it''s running.'
