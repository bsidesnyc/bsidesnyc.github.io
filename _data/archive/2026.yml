  title: 'Finding Evil Fast: Windows Memory Triage with Volatility 3'
  speakers:
  - name: Andrew Case
    company: Volexity
    title: Director of Research, Volexity
    bio: 'Andrew Case is the Director of Research at Volexity, and has significant experience in incident response handling
      and malware analysis. He has conducted numerous large-scale investigations that span enterprises and industries. Case
      is a core developer of the Volatility memory analysis framework, and a co-author of the highly popular and technical
      forensics analysis book “The Art of Memory Forensics: Detecting Malware and Threats in Windows, Linux, and Mac Memory.”
      He has presented at major industry conferences, including BSidesNYC, Black Hat, DEF CON, RSA, SecTor, DFRWS, and OMFW.'
    photo: /img/archive/2026/speakers/andrew-case.webp
  description: 'Memory analysis is an essential investigative technique for detecting modern, memory-resident malware. Unfortunately,
    it is often perceived as a difficult and manual process requiring expert knowledge of operating systems and malware internals.
    This talk challenges that assumption by presenting five checks that can be automatically performed against Windows memory
    samples to quickly surface signs of malicious code execution or attacker access.  The presented checks answer five critical
    triage questions: 1) are any processes running with unexpected privileges, 2)  are restricted resources being accessed
    by unexpected processes, 3) are any processes executing code in a suspicious manner, 4) has malware entered the kernel,
    and 5) does any process or kernel driver match known threat intelligence? All checks will be demonstrated using Volatility
    3, the most widely used open source framework for memory analysis. Attendees will leave with a compact workflow that SOC
    analysts, threat hunters, and incident handlers can use to automatically identify memory-only malware, toolkits, and attacker
    activity, helping them rapidly prioritize systems during large-scale triage and decide where deeper forensic analysis
    is warranted.'
  type: talk
