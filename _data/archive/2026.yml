  track: Entrepreneur
  room: Entrepreneur
  title: 'The Category Trap: You Don''t Pick It, the Market Does'
  speakers:
  - name: Mohammad Eshan
    company: GhostEye
    title: Founder & CEO at GhostEye
    bio: Mohammad Eshan is a security researcher, offensive operator, and the Founder and CEO of GhostEye (YC S25), an always-on
      red team for the human layer. Before founding GhostEye, he served on BlackRock's Red Team, where he built the offensive
      security program from scratch, and conducted offensive cyber operations at MITRE. He holds a Bachelor's and Master's
      in Cybersecurity from RIT.
    photo: /img/archive/2026/speakers/mohammad-eshan.webp
  description: 'Every security company gets sorted into a category whether it wants to or not. That category decides your
    budget line, your buyer, who you get compared against, and what a deal is worth before you say a word. You don''t pick
    it. The market picks the cheapest box that sort of fits.


    We learned this the hard way. We built something that lived between two categories, and the market kept filing us under
    the cheaper one. We wanted a line in the detection-and-response budget; buyers kept paying us out of the scanner budget
    instead. Same product, same demos, a fraction of the deal size, benchmarked against tools we were nothing like. For months
    I was sure we had a messaging problem. We had a category problem, and that''s a different and far more dangerous thing.


    Using our own story plus other mis-sorted companies (EDR priced as AV, ASM priced as a scanner), this talk breaks down
    the trap: what a category actually buys you, the tell that says the market has mis-sorted you, the real cost of the wrong
    bucket, and the concrete moves to climb out, with what each one cost us.


    You''ll leave able to diagnose your own category, not just reconstruct ours, and to catch the wrong bucket before it quietly
    costs you a year of runway. There''s a beat for buyers too: how to spot a category-trapped vendor and why it explains
    the pricing you''re staring at. For an early company, positioning isn''t branding. It''s survival.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '11:00'
  time_end: '12:00'
  track: Tech - Blue
  room: Tech - Blue
  title: 'Every Repo, Every Org: OSS Package Triage on a Budget'
  speakers:
  - name: Chris Wheeler
    company: Resilience
    title: CISO @ Resilience
    bio: Chris is the CISO at Resilience. Prior to Resilience, Chris led the SOAR program and the CIRT Senior Analyst Team
      at Morgan Stanley.  He is a US Navy veteran and enjoys running, home networking, and joining too many fantasy football
      leagues.
    photo: /img/archive/2026/speakers/chris-wheeler.webp
  description: 'The last year has been a steady run of mass supply-chain compromises: Shai-Hulud x2, Trivy, axios, @antv...
    the list goes on. Some advisories have named as many as 600 affected packages which grows as the incident unfolds.


    When one drops, your team needs to answer one question fast: are we affected, and where? For a small team that can''t
    afford (or hasn''t configured) SCA for every repository, that''s a challenge. Your product repos might have SBOMs and
    CI, but your prototypes, internal tools, and the app Chad in Marketing vibe-coded probably don''t.


    To solve this ourselves, we built an open-source tool that helps us do three main things: 1) consolidate SBOMs for every
    repo across multiple GitHub orgs and ingest them into another excellent open source project called Dependency Track. 2)
    quickly parse a threat advisory''s list of affected packages, and 3) query for all of them simultaneously to see if you''re
    affected and where.


    The tool uses GitHub''s free SBOM endpoint, so the only configuration cost is enabling one setting which we''ll provide
    you a script to audit yourself. TCO for our usage is ~$100/month in AWS infrastructure charges.


    In this talk, I''ll walk through our previous and improved incident-response process, a live demo of the tool, and some
    additional automations our team has built now that we have consolidated coverage.  I''ll also cover the limits of the
    approach, where we''re still refining, and some things we learned along the way.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
