  title: 'Binary Jiujitsu: Your First Buffer Overflow'
  speakers:
  - name: Joshua Connolly
    company: null
    title: Vulnerability Researcher/Reverse Engineer
    bio: I am a vulnerability researcher and reverse engineer focused on embedded device exploitation. I'm an avid CTFer but
      what I enjoy the most is teaching interesting topics to people.
    photo: /img/archive/2026/speakers/joshua-connolly.webp
  description: This hands-on workshop teaches developers how buffer overflows work by exploiting one. Students skip the theory-heavy
    preamble and get straight to the stack — learning how function calls are laid out in memory, how user input can corrupt
    a return address, and how an attacker turns that corruption into arbitrary code execution. The workshop closes with students
    executing an exploit against a live target.
