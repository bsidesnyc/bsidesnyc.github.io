- time_start: '16:00'
  time_end: '16:25'
  track: Entrepreneur
  room: Entrepreneur
  title: LLM Generated Code Works. It's Also Vulnerable.
  speakers:
  - name: Nick Shrimankar
    company: Immersivle, Inc
    title: Immersivle, Inc, Founder
    bio: Nick is the founder of Immersivle, a hands-on training platform for DevSecOps, cloud infrastructure and cybersecurity.
      With over a decade of experience spanning cloud architecture, application security and infrastructure automation, he
      built Immersivle from the ground up using AI agents as his primary development partners — shipping a full production
      platform as a solo engineer. He's an ACT-IAC Fellow and Founder Institute alum based in the DC area. Nick speaks about
      what it actually looks like to build with AI, with a focus on honest tradeoffs and practitioner-level takeaways over
      hype.
    photo: /img/archive/2026/speakers/nick-shrimankar.webp
  description: 'LLM-generated code has a dangerous quality: it works. It runs, it passes the quick eyeball test, and that''s
    exactly the problem; because working and secure are not the same thing. This talk is about the new review skill nobody
    trained us for: spotting and hardening the vulnerabilities in code a machine wrote before it reaches production.

    When a human writes a risky line, another human usually catches it in review. That safety net has held for decades. But
    AI generates code so fast and so fluently that the net now has holes in it, and most teams haven''t noticed.

    Here''s the trap. LLM-generated code looks finished. It reads clean, it compiles, it runs. So reviewers relax because
    polish feels like proof. But fluent isn''t the same as safe, and the very confidence that makes AI code pleasant to read
    is what makes it slip past us.

    I''ll walk through four areas: where machine-generated code quietly breaks trust boundaries, the classes of vulnerability
    that show up most often and why they hide so well, what a sane review process looks like when a real share of your commits
    had a non-human co-author, and how to build the habits so this scales. Think of it like onboarding a brilliant new hire
    who writes beautiful code and has zero memory of your security policies. You don''t stop the hire. You build the habits
    that catch what they miss.

    You''ll leave able to spot the failure patterns, ask the right questions and put guardrails in place before AI code ships
    rather than after it breaks.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '16:00'
