  track: Entrepreneur
  room: Entrepreneur
  title: 'Content as Go-To-Market: Build a Category, Not a Funnel'
  speakers:
  - name: Amir Kavousian
    company: DevArmor
    title: Founder & CEO, DevArmor
    bio: 'Amir Kavousian is a two-time cybersecurity founder and the CEO of DevArmor, an AI-native platform reinventing threat
      modeling and security design reviews for the AI era. Previously, he was co-founder and CTO of Altitude Networks (acquired
      by CoinList), where he led engineering and security for Fortune 500 clients. He also led engineering teams at Capital
      One and holds a PhD in Engineering from Stanford.


      At DevArmor, Amir is tackling one of the most persistent challenges in AppSec: scaling secure-by-design practices without
      compromising developer speed. His team is building AI agents that automate threat modeling and security reviews, identify
      logic flaws, and embed security guardrails directly into development workflows.


      Amir lives in the Bay Area with his wife and two daughters. Outside of work, he’s an avid tennis player, a runner, and
      a former mountaineer hoping to return to high altitudes someday.'
    photo: /img/archive/2026/speakers/amir-kavousian.webp
  description: 'Most security startups run "content marketing" the same way: gate an ebook behind a form, capture the emails,
    drip a nurture sequence, and call it a funnel. That may work for some time, but it doesn''t work when you are building
    a new category.


    My thesis is that if you want to own a space, don''t just run a funnel. Instead, build the map everyone else navigates
    by. Write the reference material, define the vocabulary, and become the default name people reach for when budget finally
    shows up for this category. That''s content as category creation, and it compounds over time. A good funnel degrades when
    you stop paying, but a canonical resource accrues authority, citations, and inbound for years.

    In this talk I''ll share my playbook: how to find the category artifact nobody owns yet and make the definitive version
    of it; why giving it away for free and naming your competitors is what builds the trust that drives inbound; how a newsletter
    keeps an audience warm between the big drops; and how to think honestly about pipeline. I''ll also call out the tarpits:
    gating everything and strangling your own reach, dressing a sales pitch up as "content," publishing once and expecting
    it to compound, and chasing SEO-slop volume instead of authority.

    Threat modeling is my running example because it''s what I''ve spent my career on, but the mechanics work for anyone trying
    to own a niche, including practitioners who want to build real authority in a space without turning into a LinkedIn influencer.'
  type: talk
