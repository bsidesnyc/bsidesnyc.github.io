  title: Intro to Secret Scanning Research
  speakers:
  - name: Zach Rice
    company: Aikido
    title: Head of Secrets Scanning at Aikido | Betterleaks / Gitleaks author
    bio: 'Zach Rice is the Head of Secrets Scanning at Aikido Security, the original author of Gitleaks, and the creator of
      Betterleaks. He is passionate about keeping secrets scanning low-friction and accessible for all developers.


      Before joining Aikido, Zach honed his craft at Truffle Security and GitLab, and founded a small secrets scanning company.


      Zach holds a BS in Computer Engineering from the University of Illinois Urbana-Champaign (UIUC).'
    photo: /img/archive/2026/speakers/zach-rice.webp
  description: 'Leaked secrets are everywhere, and scanning for them is relatively straightforward: download data, scan the
    data. Because of this, it''s a rather saturated research area. Producing truly novel security research requires one of
    three things: new secret detection techniques, new secret detectors, or new sources for leaked secrets.


    In this 2-hour workshop, we''ll walk attendees through the major OSS secret scanners: gitleaks, trufflehog, and kingfisher.
    We''ll discuss the pros and cons of each, and when to use which. Then we''ll show how to customize a brand new open-source
    tool, Betterleaks, a modern build of gitleaks.


    Live, during class, attendees will create detection signatures for never-before-detected secret types and then scan a
    few novel sources.


    Attendees will walk away having seen previously undetected secrets surfaced in real time, along with a repeatable process
    for producing novel research on their own.


    This workshop is taught by two secret scanning experts:

    - Zach Rice is the original author of Gitleaks and is actively building the next-generation secret scanner Betterleaks.

    - Joe Leon formerly led secret scanning security research at Truffle Security, the company behind TruffleHog.'
