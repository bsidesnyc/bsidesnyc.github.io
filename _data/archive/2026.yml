  track: Tech - Other
  room: Tech - Other
  title: Feeling the heat from Malicious Packages? Cooloff with Cooldowns
  speakers:
  - name: Leif Dreizler
    company: Raindrop
    title: Founding Security Engineer @ Raindrop
    bio: 'Leif Dreizler is an information security professional with over a decade of experience. He is currently the Founding
      Security Engineer at Raindrop.


      Previously, Leif was a Security IC and Software EM at both Semgrep and Twilio Segment.'
    photo: /img/archive/2026/speakers/leif-dreizler.webp
  description: 'We’ve seen a surge in attacks that compromise third-party packages, resulting in costly and disruptive incident
    response for engineering and security teams.


    The good news is that detection is getting faster. Many malicious package versions are identified and removed from public
    registries within hours or days of being published.


    If you avoid installing recently released versions, you can dramatically reduce your exposure to these attacks. In response,
    package managers are introducing cooldowns—simple controls that delay adopting new releases long enough for malicious
    versions to be caught and removed.


    In this talk, I''ll share how we rolled out dependency cooldowns across multiple package managers at Semgrep. I’ll provide
    concrete examples and takeaways you can use to protect your organization without disrupting development workflows.'
  type: talk
