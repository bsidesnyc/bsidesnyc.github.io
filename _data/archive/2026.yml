  title: 'Secrets That Survive Everything: Finding Runtime Credentials in Production Web Applications'
  speakers:
  - name: Hemanth Gorijala
    company: null
    title: Global Pentest Lead | Author of SecretSifter
    bio: Hemanth Gorijala is an application security professional and penetration tester with 13 years of experience in a
      global Fortune 500 environment. He conducts web application security assessments and reviews vulnerability reports in
      enterprise bug bounty programs. The exploitation chains in this talk are drawn from his own authorized assessments.
      He built SecretSifter to close the runtime security gap.
    photo: /img/archive/2026/speakers/hemanth-gorijala.webp
  - name: Anil Gali
    company: null
    title: Sr. Security Engineer
    bio: Anil Gali is a security researcher and engineer specializing in application security, cloud credential management,
      and vulnerability analysis. He has led investigations uncovering runtime secrets in production environments and contributed
      to improving secure coding standards across enterprise teams. His research bridges bug‑bounty insights with scalable
      security engineering, offering actionable lessons for developers and security professionals alik
    photo: /img/archive/2026/speakers/anil-gali.webp
  description: 'A bug bounty researcher found Azure credentials in a JavaScript file and called it done. I kept going - four
    Azure AD credentials in a public JS file, enough to authenticate as the application itself. The application''s token had
    been granted user-level permissions - every account in the system was reachable. SAST and GitLeaks were running. The credentials
    were still live.


    That was one chain. A second application used CryptoJS to encrypt its configuration. The decryption key was hardcoded
    three lines away from the encrypted blob. The secret to unlock everything was sitting next to the lock. Same result.


    Shift-left tools scan what you commit. They do not scan what you serve. Build-time injection, CI/CD substitution, SSR
    state blobs, lazy-loaded chunks, runtime-fetched config, and deliberate scanner suppression each put live credentials
    in production after every scanner has run. Once a secret reaches production, it disappears from every scanner''s view.
    The only things finding runtime secrets are manual penetration testers, bug bounty researchers, and attackers. Two of
    those three report what they find.


    This talk walks through both chains, maps the full shift-right gap, and closes with a live demo using a purpose-built
    intentionally vulnerable healthcare portal. SecretSifter - a free Burp extension and browser tool - finds every secret
    passively, without configuration, as traffic flows.'
  type: talk
