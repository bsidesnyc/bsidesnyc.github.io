  title: 'Deep Link Vulnerabilities: When One Click Leads to Account Takeover'
  speakers:
  - name: Sai Jagadeesh
    company: null
    title: Staff Security Engineer
    bio: 'Sai Jagadeesh is a Staff Security Engineer,  where he focuses on application security and offensive security. His
      work centers on identifying and exploiting vulnerabilities in modern applications, improving secure development practices,
      and building security controls that help engineering teams ship resilient systems at scale.


      Prior to this role, Sai worked as a Senior Security Engineer at Amazon, where he contributed to securing large distributed
      platforms and strengthening application security across development pipelines. His work there also included offensive
      security initiatives, helping identify security weaknesses through adversarial testing and vulnerability research.'
    photo: /img/archive/2026/speakers/sai-jagadeesh.webp
  description: 'Deep links are widely used in mobile applications to provide seamless navigation to specific screens inside
    an app. However, when deep links are improperly validated, they can become powerful attack vectors that allow external
    inputs to directly influence internal application behavior.


    This lightning talk explores how seemingly harmless deep links can lead to serious security issues such as token leakage,
    WebView exploitation, and even one-click account takeover.


    In one example, a crafted deep link forces the app to open an attacker-controlled URL inside a WebView while automatically
    appending the victim’s authentication token, allowing the attacker to hijack the account with a single click.


    We will also look at how vulnerable WebView configurations combined with exported deep link activities can enable attackers
    to exfiltrate session cookies, load malicious content, or execute privileged actions inside the app context.


    This talk highlights common developer mistakes, demonstrates how attackers chain deep link handling with WebView behavior,
    and provides practical mitigation strategies to secure mobile applications against these hidden entry points.'
