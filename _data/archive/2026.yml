  title: 'The Accidental Leader: An Engineer''s Path to Startups and Conferences'
  speakers:
  - name: Chris Maenner
    company: BSidesPhilly
    title: BSidesPhilly Organizer
    bio: 'Chris is Head of Cybersecurity at Ybor Technology, where he focuses on securing Kubernetes platforms, AI workloads,
      and cloud-native infrastructure. He has been working in security engineering since 2006, spanning roles from early-stage
      startups to enterprise platform teams.


      Chris serves as a board member of BSidesPhilly and is a frequent speaker at security conferences, including multiple
      BSides events, Boardwalk Bytes, and corporate conferences. He''s passionate about helping fast-moving teams build secure
      systems without sacrificing velocity.


      Outside of security, Chris builds music applications and spends his free time visiting music venues around the world.'
    photo: /img/archive/2026/speakers/chris-maenner.webp
  description: 'In 2006, I was an engineer who just wanted to solve hard technical problems. I never planned to run security
    teams, lead startups, or help build conferences. But somewhere along the way, the path forked—and I kept saying yes.


    This talk is the story of that journey: from individual contributor to Head of Security, from attendee to BSides board
    member, from employee to startup operator. It''s about the moments that forced me to grow, the mistakes I made along the
    way, and what I wish someone had told me earlier.


    We''ll cover:

    - When to stay technical vs. when to step into leadership

    - What running a startup actually looks like (spoiler: less glamorous than Instagram suggests)

    - How building conferences changed how I think about community and career

    - The skills that transferred and the ones I had to learn from scratch


    This isn''t a talk about frameworks or methodologies. It''s an honest conversation about building things that matter companies,
    teams, and communities.'
  type: talk
