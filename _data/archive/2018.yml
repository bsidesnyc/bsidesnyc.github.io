  track: Track 1
  room: L.63
  title: Threat hunting .NET malware with YARA
  speakers:
  - name: Santiago Pontiroli
    company: Kaspersky Lab Latin America
    title: Security Analyst | Global Research and Analysis Team (GReAT)
    bio: Santiago Pontiroli joined Kaspersky Lab as a Security Researcher in October 2013. His principal responsibilities
      include the analysis and investigation of security threats in the SOLA region (South of Latin America), web application
      security, the development of automatization tools stemming from threat intelligence studies and the reverse engineering
      of programs with malicious code.
    photo: /img/archive/2018/speakers/santiago-pontiroli.webp
  description: 'YARA has recently included a module that enables researchers the creation of more fine grained rules for malware
    written for the .NET framework. These files contain valuable metadata embedded which can enable us to pinpoint a specific
    threat and reduce our number of false positives detections.


    This presentation will focus on the peculiarities of obtaining indicators of compromise from .NET malware samples and
    writing reliable YARA rules using its latest module. I''ll be showing real world examples and releasing a convenient tool
    that can query metadata information from large sets of .NET files'
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2018/blob/master/Presentations/Santiago%20Pontiroli%20-%20Threat%20hunting%20.NET%20malware%20with%20YARA.pdf
  video_url: https://archive.org/details/bsidesnyc2018?playlist=1&file=06_Threat_hunting_dotNET_malware_with_YARA.mp4
  recorded: true
- time_start: '13:00'
  time_end: '13:50'
  track: Track 2
  room: L.76
  title: Moving Graph Analytics to Higher Dimensions to Discover Network Activity / Anomalies that are implicit in behavior
    - Connections in High Dimensions
  speakers:
  - name: Richard Lethin
    company: Reservoir Labs
    title: President
    bio: Richard Lethin is President at Reservoir Labs, a private research laboratory in New York City.  Reservoir performs
      R&D for in the area of high performance computing, which includes projects developing new technologies for high speed
      communication processing with applications to cyber security.  Some of these results are available as products, including
      the ENSIGN tensor decomposition tool and the R-Scope networks sensor.  Richard formed Reservoir after completing his
      Ph.D. at the MIT AI Laboratory in 1997, where for his thesis he contributed to the development and analysis of a massively
      parallel message-driven computing system called the J-Machine, under the supervision of Professor William Dally.  Prior
      to MIT, Richard worked as an engineer at the startup company Multiflow, founded by Dr. Josh Fisher, John O’Donnell and
      John Ruttenberg, that developed the world’s first of the now ubiquitous Very Large Instruction Word (VLIW) computer
      architectures, and where he was responsible for the floating point data paths. Richard is also Associate Professor (Adjunct)
      in Electrical Engineering at Yale, where he teaches courses including Computer Architecture for Cognitive Computing.
    photo: /img/archive/2018/speakers/richard-lethin.webp
  description: 'Advanced mathematics made simpler: Spectral Hypergraph Analysis for mortals. Imagine lighting up and "shining"
    your network logs through a special prism that would separate behaviors into a "spectrum" that would indicate to you things
    that are going on on your network. Some of the those things might be important discoveries with security implications.
    Doing this would be like how astronomers determine the materials that are burning in a distant star, using a special telescope
    to get the spectrum of that star''s light. It turns out that there is a mathematical way to do this on network logs, involving
    a generalization of the Fourier Transform over high dimensional graphs. This talk will explain this technology in accessible
    ways, and show examples of its use in discovering "bad stuff" on a very large network.'
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2018/blob/master/Presentations/Reservoir%20Lethin%20-%20Moving%20Graph%20Analytics%20to%20Higher%20Dimensions%20to%20Discover%20Network%20Activity%20%3A%20Anomalies%20that%20are%20implicit%20in%20behavior%20-%20Connections%20in%20High%20Dimensions.pdf
  video_url: null
