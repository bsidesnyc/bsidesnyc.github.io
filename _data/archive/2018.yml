  track: Track 1
  room: L.63
  title: 'Open Up and Say 0x41414141: Attacking Medical Devices'
  speakers:
  - name: Robert Portvliet
    company: Cylance
    title: Technical director of red team services
    bio: 'Robert Portvliet is technical director of red team services at Cylance with over 8 years’ experience in various
      disciplines of penetration testing. His focus is on embedded systems and wireless penetration testing and reverse engineering.
      Prior to joining Cylance, he was the network security service line lead for Foundstone and taught the ‘Ultimate Hacking:
      Wireless’ class at Blackhat 2011-2013'
    photo: /img/archive/2018/speakers/robert-portvliet.webp
  description: 'Network accessible medical devices are ubiquitous in today''s clinical environment. These devices can be of
    great aid to healthcare professionals in assessing, treating and monitoring a patient''s condition. However, they can
    also fall victim to a number of systemic vulnerabilities that can expose personal health information or PHI, compromise
    the integrity of patient data in transit, and affect the availability of the devices themselves.


    This talk looks at the methodology and approach to penetration testing of modern medical devices. It will provide an overview
    of the various stages of a medical device assessment, including discovery and analysis of a device''s remote and local
    attack surface, reverse engineering and exploitation of proprietary network protocols, vulnerability discovery in network
    services, compromising supporting systems, attacking common wireless protocols, exploitation of hardware debug interfaces
    and bus protocols and assessing proprietary wireless technologies.


    It will also cover a number of real world vulnerabilities that the speaker has discovered during medical device penetration
    testing assessments. These include weak cryptographic implementations, device impersonation and data manipulation vulnerabilities
    in proprietary protocols, unauthenticated database interfaces, hardcoded credentials/keys and other sensitive information
    stored in firmware/binaries and the susceptibility of medical devices to remote denial of service attacks.


    The talk will conclude with some suggestions on how some of the most common classes of medical device vulnerabilities
    might be remediated by vendors and also how hospitals and other healthcare providers can defend their medical devices
    in the meantime.'
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2018/blob/master/Presentations/Robert%20Portvliet%20-%20Open%20Up%20and%20Say%200%C3%9741414141%20-%20Attacking%20Medical%20Devices.pdf
  video_url: https://archive.org/details/bsidesnyc2018?playlist=1&file=05_Open_Up_and_Say_0x41414141.mp4
  recorded: true
- time_start: '11:00'
  time_end: '11:50'
  track: Track 2
  room: L.76
  title: Evading C2 Detection with Asymmetry
  speakers:
  - name: Brandon Arvanaghi
    company: Gemini
    title: Security Engineer
    bio: Brandon Arvanaghi is a security engineer at Gemini. Before Gemini, Brandon was a security consultant at Mandiant.
      Brandon has written tools to detect webshells, obfuscated malware, and to evade sandboxes in every language. He is the
      author of SessionGopher, CheckPlease, and a contributor to PowerShell Empire. Prior to working in the security industry,
      Brandon conducted research on automated attack plan generation at Vanderbilt University.
    photo: /img/archive/2018/speakers/brandon-arvanaghi.webp
  - name: Andrew Johnston
    company: Mandiant
    title: Proactive Consultant
    bio: Andrew Johnston is a proactive consultant with Mandiant, a division of FireEye. His work focuses on gaining access
      to critical places and systems through covert tactics. Andrew also is the lead researcher of a team at Fordham University
      focused on using artificial intelligence to solve problems in the counterterrorism and national defense sphere. He holds
      a bachelor's degree from Fordham University with a dual major in computer science and applied mathematics.
    photo: /img/archive/2018/speakers/andrew-johnston.webp
  description: Detecting callouts to command-and-control (C2) servers used to be straightforward, but attackers in your network
    have found ways to communicate with the outside world even under the heaviest of scrutiny. In this talk, we discuss ways
    to use popular websites as means of getting commands and exfiltrating information. We examine the applications of asymmetric
    communication, from Internet-accessible computers to embedded devices to air-gapped systems. Finally, we give some suggestions
    to defenders, and discuss how to detect and mitigate risks that enable asymmetric malware.
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2018?playlist=1&file=08_Evading_C2_Detection_with_Asymmetry.mp4
  recorded: true
