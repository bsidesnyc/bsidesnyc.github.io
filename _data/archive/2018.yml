  time_end: '16:50'
  track: Entrepreneur Track
  room: L.61
  title: Product Management of Security Solutions
  speakers:
  - name: Lenny Zeltser
    company: Minerva Labs
    title: VP of Products
    bio: Lenny is a seasoned business and tech leader with extensive experience in information security. He builds innovative
      endpoint defense solutions as VP of Products at Minerva. Beforehand, Lenny served as a Director of Product Management
      at a Fortune 500 company with a focus on security software and services. Previously, he led the enterprise security
      consulting practice at a major cloud services provider. A frequent public speaker and writer, Lenny has co-authored
      books on network security and malicious software. He is also a senior instructor at SANS Institute. Lenny holds an MBA
      from MIT Sloan and a Computer Science degree from the University of Pennsylvania.
    photo: /img/archive/2018/speakers/lenny-zeltser.webp
  description: Established enterprises as well as startups have much to consider when deciding how to build, deliver and maintain
    information security products that make sense for their businesses and customers. The individuals tasked with creating
    and overseeing such offerings often have "product management" in their titles. What do these people do? What skills do
    they possess? This session explores the mindset of a product manager who focuses on information security solutions. Those
    new to this discipline will better understand whether they should consider such a role. Those already tasked with managing
    security solutions will benefit from hearing about a lightweight framework that can help them make better decisions about
    their products.
  type: talk
  slides_url: null
  video_url: null
  recorded: null
