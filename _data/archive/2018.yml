  track: Track 2
  room: L.76
  title: 'The Politics of Intelligence: Applying History to Modern Day Cyber Threat Intelligence'
  speakers:
  - name: Paul Jaramillo
    company: CrowdStrike
    title: Principal Consultant
    bio: 'Paul Jaramillo has over ten years of experience conducting incident response and enterprise security operations,
      including a career with the U.S. Department of Energy’s National Nuclear Security Administration. As a Principal Consultant
      based out of CrowdStrike’s St. Louis office, Paul participates in customer engagements ranging from breach response
      to proactive compromise and adversary assessments. Along with the Midwest office, Paul helps customers in taking the
      fight to the adversary.


      Prior to his work at CrowdStrike, Paul was Sr. Manager of IT Security for a Fortune 500 energy company. In this role,
      he led a global team responsible for incident response, digital forensics, IT security risk management, security operations,
      and security awareness. Paul also was responsible for building a 10 person, 24/7 global incident response capability
      at a Fortune 100 international manufacturer. In addition, he has spent time on the offensive side of security as a pen
      tester for a Fortune 10 conglomerate, as well as 10 years in the telecommunications industry.


      Paul has a Bachelors of Business Administration in Management Information Systems from the University of Oklahoma, which
      he attended as a National Merit and Regents scholarship recipient. Paul currently holds his CISSP and GCFA certification
      and has previously held EnCE, CCNA, and C|EH certifications. While working for the government, he held both DoD Top
      Secret and DoE Q clearances. Paul is also the founder of the St. Louis security conference ArchCON. Paul has most recently
      spoken at BsidesNOLA, ArchCon, BsidesSanDiego and the SANS Threat Hunting Summit.'
    photo: /img/archive/2018/speakers/paul-jaramillo.webp
  description: How many organizations have an effective strategic threat intelligence operation? Many have failed and many
    struggle to obtain executive buy in or even mild interest in any of their cyber threat intelligence reports. By examining
    the history of the POTUS's use of intelligence, some powerful lessons can be learned. For instance, one president created
    and relied on his own private intelligence group of peers. Another president ignored SIGINT completely because of a preference
    for "cloaks and daggers". Yet another president, told the intelligence community their analysis will support a decision
    he has already made! These are all important insights into executive leadership, their psychology, and how best to serve
    their intelligence needs. This presentation will highlight and summarize several key lessons which can be applied to create
    or improve upon a strategic threat intelligence program.
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2018/blob/master/Presentations/Paul%20Jaramillo%20-%20The%20Politics%20of%20Intelligence%20-%20Applying%20History%20to%20Modern%20Day%20Cyber%20Threat%20Intelligence.pdf
  video_url: https://archive.org/details/bsidesnyc2018?playlist=1&file=10_The_Politics_of_Intelligence.mp4
  recorded: true
