- time_start: '10:00'
  time_end: '10:45'
  track: Track 1
  room: L.63
  title: Docker Containers for Malware Analysis
  speakers:
  - name: Lenny Zeltser
    company: NCR Corp
    title: Product Management Director
    bio: 'Lenny Zeltser is a seasoned business and tech leader with extensive experience in information technology and security.
      As a product management director at NCR Corp, he heads the software and services group that address customers’ data
      protection needs. Before NCR, Lenny led the enterprise security consulting practice at a major cloud services provider.
      He also trains professionals in digital forensics and malware combat at SANS Institute. In addition, Lenny is a Board
      of Directors member at SANS Technology Institute.


      Lenny’s expertise is strongest at the intersection of business, technology, and information security and includes incident
      response, cloud services, and product management. He frequently speaks at conferences, writes articles, and has co-authored
      books on network security and malicious software. Lenny has an MBA degree from MIT Sloan, a Computer Science degree
      from the University of Pennsylvania and has earned the prestigious GIAC Security Expert designation from SANS Institute.'
    photo: null
  description: There are wonderful malware analysis applications out there that run well on Linux; however, installing and
    configuring them could be quite challenging. A relatively new approach using such tools involves running them as application
    containers. This session will discuss how you can use malware analysis tools that are already distributed as Docker images
    as part of the REMnux project. These tools include Thug, Viper, JSDetox, and others. It will also offer tips for packaging
    your favorite apps in a similar manner. Attend this session to start learning about Docker containers, so you can not
    only use them when examining malicious software, but also so you better understand what application containers are and
    what role they might play alongside other infrastructure technologies.
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2016/blob/master/Presentations/Lenny%20Zeltser%20-%20Docker%20Containers%20for%20Malware%20Analysis.pdf
  video_url: null
  recorded: false
