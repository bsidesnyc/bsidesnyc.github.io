- time_start: '16:00'
  time_end: '16:45'
  track: Track 1
  room: L.63
  title: No Silver Bullet. Multi contextual threat detection via Machine Learning
  speakers:
  - name: Rod Soto
    company: Splunk User Behavioral Analytics
    title: Security Researcher
    bio: Rod Soto has over 15 years of experience in information technology and security. Currently working as a Security
      Researcher at Splunk User Behavioral Analytics. He has spoken at ISSA, ISC2, OWASP, DEFCON, Hackmiami, Bsides and also
      been featured in Rolling Stone Magazine, Pentest Magazine, Univision and CNN. Rod Soto was the winner of the 2012 BlackHat
      Las vegas CTF competition and is the founder and lead developer of the Kommand && KonTroll competitive hacking Tournament
      series.
    photo: null
  - name: Joseph Zadeh
    company: null
    title: Security Data Scientist
    bio: 'Joseph Zadeh studied mathematics in college and received a BS from University California, Riverside and an MS and
      PhD from Purdue University. While in college, he worked in a Network Operation Center focused on security and network
      performance baselines and during that time he spoke at DEFCON and Torcon security conferences.


      Most recently he joined Caspida as a security data scientist. Previously, Joseph was part of the data science consulting
      team at Greenplum/Pivotal helping focused on Cyber Security analytics and also part of Kaiser Permanente’s first Cyber
      Security R&D team.'
    photo: null
  description: Current threat detection technologies lack the ability to present an accurate and complete picture of how threats
    are executed and fail to put together the multi contextual relationship of exploit chain indicators. A combination of
    behavioral and machine learning technologies can provide a more effective and complete assessment and prevention of threats
    in organizations relying on dispersed, static single indicator technologies. This approach also makes use of current static
    and single threat indicator technologies using Big Data computational models.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '16:00'
  time_end: '16:45'
  track: Track 2
  room: L.76
  title: The Pagentry of Lateral Movement
  speakers:
  - name: Stuart Morgan
    company: null
    title: null
    bio: null
    photo: null
  description: In order to meaningfully compromise a client, you need to take advantage of every opportunity to gather information
    and laterally move around the network. This talk will discuss ways of abusing Pageant (PuTTY's SSH agent) on a fully patched
    Windows host, including a demonstration of a meterpreter extension which can tunnel SSH agent traffic in a manner that
    is almost undetectable with default logging options, and the way that an existing reconnaissance tool from 2012 was improved
    to make its output easier to use during a simulated attack or penetration test.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '17:00'
  time_end: '17:45'
  track: Track 1
  room: L.63
  title: An Adversarial View of SaaS Malware Sandboxes
  speakers:
  - name: Jason Trost
    company: ThreatStream, Inc.
    title: VP of Threat Research
    bio: Jason Trost is the VP of Threat Research at ThreatStream, Inc. and leads ThreatStream Labs, the research team. He
      has worked in security for more than ten years, and he has several years of experience leveraging big data technologies
      for security data mining and analytics. He is deeply interested in network security, DFIR, honeypots, big data and machine
      learning. He is currently focused on building highly scalable systems for processing, analyzing, and visualizing high
      speed network/security events in real-time as well as systems for analyzing massive amounts of malware. He is a regular
      attendee of Big Data and security conferences, and he has spoken at Blackhat, BSidesSF, BSidesLV, BSidesDC, FloCon,
      and Hadoop Summit. He has contributed to several security and big data related open source projects including the Modern
      Honey Network (MHN), BinaryPig, ElasticSearch, Apache Accumulo, and Apache Storm. He has held senior technical positions
      with the U.S. Department of Defense, Booz Allen Hamilton, and Endgame Inc. He holds a M.S. in Information Security from
      Georgia Institute of Technology and a B.S. in Computer Science from Florida State University.
    photo: null
  - name: Aaron Shelmire
    company: ThreatStream
    title: Security Professional
    bio: While having “played around” with computers as Pittsburgh, PA far back as high school, Aaron held out hope to become
      a famous dj or video game creator in the 90s. It wasn’t until 2004 when he began his long twisted journey into information
      security, when the super computers he was working on at PSC were hacked by a dire and sophisticated threat that penetrated
      over a thousand organizations over a multi‐year period...that turned out to be a 16 year old kid in Uppsala, Sweden
      during the Stakkato attacks. Aaron switched gears, began piecing together a security practice at the PSC, went to grad
      school at Carnegie Mellon, and hopped gigs to go work at CERT/CC. He then began sharing his knowledge with graduate
      students at CMU as adjunct faculty. After a few years of “applied research”, he jumped gigs for more “applied”‐ness
      / less “research”‐ness in the Dell SecureWorks CounterThreatUnit’s Special Ops team, which created and operated an end
      point detection platform in Targeted Incident Response engagements. Recently he has been focused on sharing threat intelligence
      in a programmatic way at ThreatStream.
    photo: null
  description: Anyone attending this conference knows the usefulness of running malware in a sandbox to perform triage, speed
    security analysts' workflow, extract indicators of compromise (IOCs), and to gather useful information for detection and
    mitigation. When analysts do this, what are the OPSEC concerns regarding tipping the adversary off? Which sandbox providers
    are better than others in this regard? In this talk we will present some research on taking an adversarial view of the
    free and widely used SaaS malware sandboxes. When an adversary's malware is detonated in a sandbox, what network artifacts
    can they see? Can they determine which sandbox provider based on the network? How do malware and related IOCs submitted
    to these sandboxes propagate to security companies and ultimately threat intelligence feeds? In this talk, we will answer
    all these questions and more.
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2016/blob/master/Presentations/Jason%20Trost%20%26%20Aaron%20Shelmire%20-%20An%20Adversarial%20View%20of%20SaaS%20Sandboxes.pdf
  video_url: null
  recorded: false
- time_start: '17:00'
  time_end: '17:45'
  track: Track 2
  room: L.76
  title: Warranty Void If Label Removed - Attacking MPLS Networks
  speakers:
  - name: G. Geshev
    company: null
    title: null
    bio: null
    photo: null
  description: This talk will be a walk-through of research findings from assessing multiple MPLS implementations and the
    various key weaknesses that were found to affect a number of leading vendors. General MPLS and MPLS related terms and
    concepts will be briefly introduced to the audience, followed by an overview of a typical service provider network, classic
    topologies and basic traffic engineering strategies. It should be noted that none of the examples and demonstrations require
    access to the MPLS backbone. This talk will be concluded with both general and, where applicable, vendor specific best
    practices and recommendations on reducing the attack surface of an MPLS network.
  type: talk
  slides_url: https://github.com/bsidesnyc/BSidesNYC2016/blob/master/Presentations/G.%20Geshev%20-%20Warranty%20Void%20If%20Label%20Removed.pdf
  video_url: null
