  title: Mobile implants in the age of cyber-espionage
  speakers:
  - name: Dmitry Bestuzhev
    company: Kaspersky Lab
    title: Head of Global Research and Analysis Team for Latin America
    bio: 'Dmitry Bestuzhev serves as Head of Kaspersky Lab’s Global Research and Analysis Team for Latin America, where he
      oversees the anti-malware development and investigations of the company’s experts in the region. Dmitry joined Kaspersky
      Lab in 2007 as a Malware Analyst and was responsible for monitoring the local threat landscape and providing preliminary
      analyses before going on to become Senior Regional Researcher for the Latin American region in 2008. In 2010, he was
      appointed to his current role.


      In addition to supervising the work of the network of experts in Latin America, Dmitry’s current role also includes
      producing reports and forecasts for the region and is frequently sought out by international media and organizations
      for his expert commentary on IT security. Dmitry’s wide field of expertise covers everything from online fraud, through
      the use of social networking sites by cybercriminals, to corporate security and cyberwar and cyber espionage.  Additionally,
      Dmitry participates in various educational initiatives throughout Latin America.


      Dmitry has more than 15 years of experience in IT security across a wide variety of roles and is fluent in English,
      Spanish and Russian.'
    photo: null
  description: This research is about mobile implants used in APT attacks. I will go through implants used ITW to spy on targets
    using iOS, Android, Windows Mobile and Android. I'll present current APT-threat actors mobile capabilities based on the
    code analysis/reversing I did. All samples are not PoC but real in-the-wild samples.
  type: talk
