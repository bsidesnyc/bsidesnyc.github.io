  title: Entrepreneur Hour
  speakers:
  - name: Elad Yoran
    company: Security Growth Partners
    title: CEO
    bio: 'Elad Yoran serves as CEO of Security Growth Partners (SGP) and Executive Chairman of KoolSpan. Elad’s nearly 20
      years in the cyber security industry spans experience as an executive, investor, investment banker and a several-time
      successful entrepreneur. He works with leading cyber security companies and drives them to rapid growth. Elad serves
      as Executive Chairman of KoolSpan, and a Director at Infinidat, Red Owl Analytics and Mischel Kwon Associates.


      Elad’s entrepreneurial experience includes Riptech, a provider of managed security services to governments and Fortune
      500 corporations around the world, acquired by Symantec Corporation; MediaSentry, a provider of anti-piracy technology
      solutions to the motion picture, music and software industries, acquired by SafeNet; Sentrigo, a provider of database
      security acquired by McAfee; and Vaultive, a pioneering cloud encryption company. In addition, Elad was a strategic
      investor in and advisor to NetWitness (acquired by EMC/RSA), ThreatGrid (acquired by Cisco), and Insightix (acquired
      by McAfee).'
    photo: null
  - name: Stephen A. Ridley
    company: Xipiter
    title: Principal Researcher
    bio: 'Stephen A. Ridley is principal researcher at Xipiter. Stephen has more than 10 years of experience insoftware development,

      software security, and reverse engineering. Within that last few years, he has presented his research and spoken about
      reverse engineering and software security research on every continent except Antarctica. He’s been featured on NPR,
      SecurityWeek, Wired and numerous other publications.


      Prior to his current work at Xipiter, Mr. Ridley previously served as the Chief Information Security Officer of a financial
      services firm. Prior to that, various information security researcher/consultant roles (Matasano, et al), Senior Security
      Architect at McAfee. Earlier in his career, Stephen was a founding member of the Security and Mission Assurance (SMA)
      group at a major U.S. Defense contractor where he did vulnerability research and reverse engineering in support of the
      U.S. Defense and Intelligence community.'
    photo: null
  - name: Dr. Ang Cui
    company: Red Balloon Security Inc.
    title: Founder and Chief Scientist
    bio: Dr. Ang Cui, Founder & Chief Scientist of Red Balloon Security Inc., has focused on developing new technologies to
      defend embedded systems against exploitation. Dr. Cui is the inventor of the Software Symbiote technology and the creator
      of FRAK. During the course of his research, he has also uncovered a number of serious vulnerabilities within ubiquitous
      embedded devices like Cisco routers, HP printers and Cisco IP phones. He has received numerous awards on his work in
      defending and attacking ubiquitous commercial embedded devices and was recently named a 2015 DARPA Riser.
    photo: null
  - name: Vera Sell
    company: Senrio
    title: VP of Marketing and Co-founder
    bio: Vera Sell is the VP of Marketing and a co-founder at Senrio (http://senr.io/), an enterprise-grade security solution
      for connected embedded devices (aka “Internet of Things”) serving the industrial control, MedTech, and corporate IT
      industries. She is an active Angel investor with the Oregon Angel Fund and TiE Angels Oregon; serving as the TiE Angels
      Program Director and member of the screening committee throughout 2015. From this vantage point, Vera reviewed and screened
      100+ investment applications, worked closely with entrepreneurs to get them pitch- and funding-ready, and personally
      invested in four local tech-startups. She is the Operational Partner in the TAP Fund, a side car fund investing alongside
      TiE Angels Oregon. Prior to her work at Senrio, Vera held product marketing and marketing communication positions at
      Tektronix, Biamp Systems and Avenra with a focus on connected and distributed technologies. Vera holds a Master of International
      Management from Portland State University and a Bachelor in International Business (Double Degree) from the University
      of Applied Sciences in Dresden and Plekhanov Russian University of Economics, Moscow, Russia.
    photo: null
