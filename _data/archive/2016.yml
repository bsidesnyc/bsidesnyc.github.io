  room: L.63
  title: 99 Problems but a Microkernel ain't one!
  speakers:
  - name: Alex Plaskett
    company: null
    title: null
    bio: null
    photo: null
  description: Cars, Safety Critical Systems and consumer devices (phones) all run QNX, however, very little security research
    has been performed in this area. This talk will provide an overview of QNX security architecture with Blackberry 10 used
    as the primary target. It will discuss research on a locked down highly secured embedded OS, the OS attack surface and
    methods of identifying vulnerabilities from both a reverse engineering perspective and automated fuzzing approach. This
    talk will also highlight some of the novel QNX weaknesses identified with this research and the challenges faced with
    exploit development on the platform.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '14:00'
  time_end: '14:45'
  track: Track 2
  room: L.76
  title: The Insecurity Of Things
  speakers:
  - name: Stephen A. Ridley
    company: Xipiter
    title: Principal Researcher
    bio: 'Stephen A. Ridley is principal researcher at Xipiter. Stephen has more than 10 years of experience insoftware development,

      software security, and reverse engineering. Within that last few years, he has presented his research and spoken about
      reverse engineering and software security research on every continent except Antarctica. He’s been featured on NPR,
      SecurityWeek, Wired and numerous other publications.


      Prior to his current work at Xipiter, Mr. Ridley previously served as the Chief Information Security Officer of a financial
      services firm. Prior to that, various information security researcher/consultant roles (Matasano, et al), Senior Security
      Architect at McAfee. Earlier in his career, Stephen was a founding member of the Security and Mission Assurance (SMA)
      group at a major U.S. Defense contractor where he did vulnerability research and reverse engineering in support of the
      U.S. Defense and Intelligence community.'
    photo: null
  description: There is a latent distrust of the growing Internet Of Things market. The data collected by them is becoming
    more personal all while proliferation of internet connected devices is continuing without regard to privacy or security.
    Recent news stories have consumers concerned not only with privacy but also surveillance and data handling. The enterprise,
    medtech, industrial control, and other verticals have plenty to worry about also. To compound the problem, IoT and internet
    connected consumer devices are each made from custom hardware and software. This lack of homogeneity in design makes traditional
    software-based security (like anti-virus) virtually impossible. Since the traditional solutions aren't applicable to these
    new ubiquitous devices, new techniques and technologies are needed. We'll talk about how we've been approaching the problem
    with a new platform called Senrio. At Xipiter we've been working on the security of embedded systems and IOT devices.
    Xipiter has built several industry unique trainings on mobile security and embedded device security. Each of which has
    sold out at Blackhat (the largest security conference in the world) for three years in a row. We've helped numerous manufacturers
    secure their embedded devices. From Point Sales and Entertainment Systems to the more esoteric vendors of Gaming systems
    and Industrial Controls Systems.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '15:00'
  time_end: '15:45'
  track: Track 1
  room: L.63
  title: 'Change is the only constant: A day in the life of DNS changes'
  speakers:
  - name: Ben April
    company: null
    title: null
    bio: null
    photo: null
  description: We took a one-day snapshot of Farsight's new DNS Changes channel and tore into it like an unsupervised 9 year
    old with a screwdriver. Inside we found CDNs, DGAs, phone-home services, VPN tunnels, some RTFM moments, and some WTF
    moments. Catch this inside glimpse of what you can learn about your network or your adversary by monitoring DNS.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '15:00'
  time_end: '15:45'
  track: Track 2
  room: L.76
  title: Making & Breaking Machine Learning Anomaly Detectors in Real Life
  speakers:
  - name: Clarence Chio
    company: Shape Security
    title: Product Developer
    bio: Clarence graduated with a B.S. and M.S. in Computer Science from Stanford University in 2014, specializing in data
      mining and artificial intelligence. He currently works at Shape Security, building a product that protects from malicious
      bots and automated attacks on Global 2000 customer websites. At Shape, he works on the big data analysis systems that
      are used to tackle this problem. Clarence has spoken at security conferences in Russia, Japan, Canada, and within the
      US. He is also the founder and organizer of the biggest data science and security meetup group in the San Francisco
      Bay Area.
    photo: null
  description: Machine learning (ML) techniques used in network intrusion detection are susceptible to adversarial model poisoning.
    We demonstrate this attack and analyze some proposals for how to circumvent it, then consider specific use cases of ML
    and anomaly detection in a security context. We analyze how ML can be used in security and why it is not as straightforward
    as once thought.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
