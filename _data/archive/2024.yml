  title: Building Cyber Products Customers Love
  speakers:
  - name: Ross Haleliuk
    company: LimaCharlie
    title: 'Author of ''Cyber for Builders: The Essential Guide to Building a Cybersecurity Startup'''
    bio: 'Ross is a head of product at LimaCharlie - a startup that enables organisations to detect & respond to threats,
      automate processes, and future-proof their security operations. His areas of expertise include go-to-market and product
      strategy, B2B product-led growth, strategic positioning, product-market fit expansion, operations, fundraising, and
      growth. Outside of work, Ross is a startup advisor, angel investor, frequent contributor to TechCrunch, Forbes, and
      VentureBeat, and author of VentureinSecurity.net. Ross’s book, ‘Cyber for Builders: The Essential Guide to Building
      a Cybersecurity Startup’, became an instant Amazon best seller and is recognized as a critical read for any aspiring
      and early-stage security entrepreneur.'
    photo: /img/archive/2024/speakers/ross-haleliuk.webp
  description: Building products customers love is hard. Building cybersecurity products customers love is much harder. While
    the nature of product management doesn't change from one industry to another, the truth is that many commonly accepted
    product management best practices do not work to the same degree, or have a different shape when implemented in cybersecurity.
  type: talk
  slides_url: null
