  title: Detection and Triage of Domain Persistence
  speakers:
  - name: Joshua Prager
    company: SpecterOps
    title: SpecterOps, Principal Consultant, Defensive Services
    bio: Josh Prager has over 13 years’ experience focusing on DoD red team infrastructure, cyber threat emulation and threat
      hunting. As a former threat hunter in the Federal industry, he provided various cyber threat emulation and threat hunting
      assessments throughout DOD environments. As a principal consultant at SpecterOps, he guides clients in developing the
      maturity of their detection and response programs, building their detection engineering capabilities, and ensuring detective
      and preventive coverage of offensive techniques.
    photo: /img/archive/2024/speakers/joshua-prager.webp
  - name: Nico
    company: SpecterOps
    title: Adversary Detection Consultant - SpecterOps
    bio: 'Josh Prager has over 13 years’ experience focusing on DoD red team infrastructure, cyber threat emulation and threat
      hunting. As a former threat hunter for Accenture’s Adversary Research and Reconnaissance Team he developed various cyber
      threat emulation and threat hunting programs within the Federal industry.


      Nico is a Consultant on the Defensive Capability team. He graduated from the US Naval Academy (Beat Army) with a degree
      in Cyber Operations. Prior to joining SpecterOps Nico served as a Surface Warfare Officer and as an Information Professional
      Officer during his naval career. Nico loves finding new programming languages to play with and in his free time can
      be found working on two of his other passions: music and movies.'
    photo: /img/archive/2024/speakers/nico.webp
  description: This presentation will discuss offensive tradecraft for establishing elevated persistence within an Active
    Directory environment. We will discuss domain persistence techniques we have seen during compromise assessments and the
    adversary's attack paths to establish elevated control. For each offensive technique we discuss, we will also provide
    in-depth defensive considerations covering the operational flow of technique executions, detection data models, and abstracted
    common denominators that detection engineers can use to generate detective or preventive controls.
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2024?playlist=1&file=B09_Detection_and_Triage_of_Domain_Persistence.mp4
