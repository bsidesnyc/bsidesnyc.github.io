  title: 'Bridging the Gap: Developing Accessible Anti-Phishing Solutions'
  speakers:
  - name: Lydia Stepanek
    company: Pen Loop Consulting
    title: Owner and Lead Engineer, Pen Loop Consulting
    bio: 'Lydia Stepanek spent the past decade as a software and DevOps engineer working on data-related technologies at places
      like MongoDB and Codecademy. She is the owner and lead developer of Pen Loop Consulting, specializing in improving development
      setup processes and implementing database changes without compromising the developer experience.


      In her free time, she builds apps – Too Phishy, her most recent, recently made the Google Workspace Top Rated – and
      runs a cybersecurity blog that has made the front page of Hacker News multiple times. Outside of work, Lydia finds balance
      in books and Brooklyn.'
    photo: /img/archive/2024/speakers/lydia-stepanek.webp
  description: In the realm of cybersecurity, the battle against phishing attacks remains a perpetual challenge. While email
    providers offer spam filters and enterprises invest in sophisticated anti-phishing solutions, there's a noticeable gap
    in accessibility for the average internet user. This session delves into the journey of building an anti-phishing tool
    tailored for regular people, exploring the challenges encountered and the valuable lessons learned along the way.
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2024?playlist=1&file=B02_Bridging_the_Gap_-_Developing_Accessible_Anti-Phishing_Solutions.mp4
  recorded: false
- time_start: '11:00'
  time_end: '11:30'
  track: Tech - Other
  room: L2.85
  title: Cybersecurity Considerations for Brain-Computer Interfaces
  speakers:
  - name: Tyler Schroder
    company: Yale University
    title: Director's Fellow, Digital Ethics Center at Yale University
    bio: Tyler Schroder is a senior Computer Science BS/MS candidate at Yale University focusing on cyber security (both technical
      and policy). Tyler is the inaugural Director's Fellow at Yale's Digital Ethics Center. He has been recognized as a CrowdStrike
      Next-Gen Scholar and an ARRL Radio Digital Communications Scholar. His past research includes CVEs in password manager
      applications and exploring process automation and improvement for businesses. Tyler holds a CompTIA Security Analytics
      Professional (CySA+ Sec+ Net+ A+ Svr+), ISC2 Certified in Cyber Security, and a CrowdStrike Certified Falcon Administrator
      and Responder. Previously IR @ Microsoft.
    photo: /img/archive/2024/speakers/tyler-schroder.webp
  - name: Renee Sirbu
    company: Yale University
    title: Researcher, Yale Digital Ethics Center
    bio: Renée Andrea Sirbu is a Postgraduate Associate at the Digital Ethics Center. She received her B.Sc. in Human Biology,
      Bioethics, and Analytic Philosophy at the University of Toronto (‘21) and her M.P.H. in Health Policy and Public Health
      Modeling from the Yale School of Public Health (‘23). Renée’s interests include information and privacy law, healthcare
      and national cybersecurity, and AI/ML ethics. Her research is primarily focused on the ethical use of healthcare AI
      in clinical settings, human-computer interaction, brain-computer interfaces, and the governance of AI/ML software as
      a medical device (SaMD). She is working to create a regulatory landscape for postmortem digital autonomy, seeking to
      answer the question “what happens to our digital selves after we die?” Renée is also an affiliate of the Faculty of
      Medicine at Imperial College London, and an alumna trainee of the Population Health Analytics Laboratory at the Dalla
      Lana School of Public Health (University of Toronto).
    photo: /img/archive/2024/speakers/renee-sirbu.webp
  description: Brain-computer interfaces (BCIs) show enormous potential for advances in personalized medicine. Despite clear
    therapeutic benefits, BCIs offer a direct pathway to the brain, introducing new avenues for cyber-attacks or security
    compromises. In forthcoming original research with the Digital Ethics Center at Yale University, we make three core policy
    recommendations to device manufacturers and regulators to better secure these devices and protect patient safety.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '11:00'
  time_end: '11:30'
  track: Tech - Red
  room: L.63
  title: Breaking free from the chains of fate - Bypassing AWSCompromisedKeyQuarantineV2 Policy
  speakers:
  - name: gl4ssesbo1
    company: null
    title: Security Engineer
    bio: 'Bleon is an Info-sec passionate about Infrastructure Penetration Testing and Security, including Active Directory,
      Cloud (AWS, Azure, GCP, Digital Ocean), Hybrid Infrastructures, as well as Defense, Detection and Thread Hunting. He
      has presented in conferences like BlackHat and BSides on topics related to Cloud Penetration Testing and Security.

      His research include Nebula, a Cloud Penetration Testing Framework (https://github.com/gl4ssesbo1/Nebula) and other
      blogs, which you can also find on his blog (blog.pepperclipp.com).

      He is also the author of the upcoming book "Deep Dive into Clouded Waters: An overview in Digital Ocean''s Pentest and
      Security" (https://leanpub.com/deep-dive-into-clouded-waters-an-overview-in-digitaloceans-pentest-and-security)'
    photo: /img/archive/2024/speakers/gl4ssesbo1.webp
  - name: Opie
    company: Permiso
    title: Senior Researcher @ Permiso P0 Labs
    bio: Born with a screwdriver in his hand, Andy has been digging into the internals of technology since he opened his eyes
      and in the security industry since the era of dial-up. Proudly a generalist, Andy has turned his hand at a wide swath
      of security industry focuses on both the offensive and defensive sides over the last 25 years. When he’s not breaking
      systems and questioning assumptions, you can find him suspiciously connecting his laptop to things, pushing buttons
      that say “Do not press,” biking mountains, and climbing rocks.
    photo: /img/archive/2024/speakers/opie.webp
  description: Amazon's AWSCompromisedKeyQuarantineV2 policy is not the panacea it might seem. Join us on an adventure of
    all the myriad ways to work around this policy, when you discover leaked keys in the wild. This presentation is a fun,
    multimedia exploration of all the shortcomings of the AWSCompromisedKeyQuarantineV2 policy that is attached whenever Amazon
    detects that a key and secret pair have been leaked in the wild. We'll include demos of actual exploitation and color
    commentary on how this policy and defender strategy can be improved.
  type: talk
  slides_url: null
  video_url: https://youtu.be/nKwRmf-DvaI?si=4wyfZG-ElXSfXmC_
  recorded: true
- time_start: '11:30'
  time_end: '12:00'
  track: Entrepreneur
  room: L.61
  title: GEN-Z Critique on SOC 2
  speakers:
  - name: Charissa Kim
    company: Semgrep
    title: Technical Program Manager (Security TPM)
    bio: 'Charissa Kim is a Security TPM at Semgrep. She has spoken on various panels and presented at conferences such as
      the National Cryptologic Foundation (NCF), National Institute of Standards and Technology (NIST), National Initiative
      for Cybersecurity Education (NICE), and many others. Charissa also founded Cyber Youth Tech (CyTech), a non-profit organization
      devoted to empowering the next generation of STEM and cybersecurity professionals.


      Furthermore, Charissa directed and produced K-12 Cyber Talk, a cybersecurity webcast sponsored by the National Security
      Agency, providing a welcoming environment for K-12 students to learn and explore cybersecurity along with its diverse
      career options and opportunities. She is also the first female All-American from the National CyberPatriot and Northrup
      Grumman Nationals competition.'
    photo: /img/archive/2024/speakers/charissa-kim.webp
  description: Over the past few months, I had the opportunity to witness Series C security startup, Semgrep, navigate its
    SOC 2 certification. I was also interested in the general understanding of SOC 2 with engineers, so I went and interviewed
    50 of them to hear their viewpoints! I uncovered surprising insights into SOC 2, GRC, and security policies. In this talk,
    I'll share the essential steps for obtaining SOC 2 certification at a tech startup, providing quick and straightforward
    strategies for success.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '11:30'
  time_end: '12:00'
  track: Tech - Blue
  room: L2.84
  title: Building canaries with ELK and ElastAlert2
  speakers:
  - name: Andrew Januszak
    company: null
    title: Systems Engineer and Pentester
    bio: I work as a systems engineer in higher ed and also serve as a contract pentester for REN-ISAC.
    photo: /img/archive/2024/speakers/andrew-januszak.webp
  - name: Keith Erekson
    company: null
    title: Systems Architect and Security Enthusiast
    bio: Linux sysadmin for 20 years, unofficial/sometimes red- and blue-team conscript, systems architect, benevolent hacker
    photo: /img/archive/2024/speakers/keith-erekson.webp
  description: Canaries (honeytokens, canary tokens, canary files, canary accounts, etc...) are relatively low-effort high-gain
    defensive tools. We wanted to use our existing infrastructure and tooling to implement canaries in various places across
    different services. We decided to build our own canaries, leveraging our ELK stack for data collection and our ElastAlert2
    instance for alert tuning and generating notifications across different communication channels.
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2024?playlist=1&file=B03_Building_canaries_with_ELK_and_ElastAlert2.mp4
  recorded: false
- time_start: '11:30'
  time_end: '12:00'
  track: Tech - Other
  room: L2.85
  title: Quantum Computing and Its Impact on Cybersecurity
  speakers:
  - name: Rashmi
    company: AWS
    title: Application Security Engineer, AWS
    bio: Rashmi is a cybersecurity engineer specializing in application security with three years of experience in the field.
      She has a keen expertise in safeguarding applications from cyber threats, ensuring robust and secure software environments.
      Rashmi has worked organizations such as AWS and EA Sports, where she honed her skills and contributed to the security
      of critical applications. Outside of work, Rashmi enjoys exploring comedy clubs, playing badminton, and reading books,
      combining a love for both mental and physical activities.
    photo: /img/archive/2024/speakers/rashmi.webp
  description: Quantum computing is poised to revolutionize the field of cybersecurity, introducing both unprecedented opportunities
    and significant challenges. This session will delve into the fundamental principles of quantum computing and its stark
    differences from classical computing. We will explore how quantum algorithms, like Shor's algorithm, threaten current
    encryption methods such as RSA and ECC, necessitating the development of quantum-resistant cryptography.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '11:30'
  time_end: '12:00'
  track: Tech - Red
  room: L.63
  title: How I hacked a cloud production environment with external Terraform manipulation
  speakers:
  - name: Uri Aronovici
    company: ZEST Security
    title: Co-Founder & CTO - ZEST Security
    bio: Ex Israeli intelligence with over a decade in cyber security specializing in both offensive and defensive practices
      and operations and cloud and product security for large organizations. Uri led the security architecture activities
      at Akamai where he oversaw global vulnerability management, product security and the company’s cloud security risk remediation
      strategy.
    photo: /img/archive/2024/speakers/uri-aronovici.webp
  description: Terraform by HashiCorp is a leading Infrastructure as Code (IaC) tool that enables DevOps to define and provision
    cloud infrastructure. At the heart of Terraform's functionality are many external modules, services and third-party components
    that are used for planning and deployment. We uncovered a new attack path which has high probability as it leverages commonly-used
    external Terraform functionalities that are often not properly vetted or even visible. In this session, Uri will cover
    how he exploited a widely-used Terraform deployment as part of a CI/CD process to gain full control of a cloud production
    environment.
  type: talk
  slides_url: null
  video_url: https://youtu.be/3hXsUhbw2dE?si=3mblDpAf4LMcdoNo
  recorded: true
- time_start: '12:00'
  time_end: '13:00'
  track: Entrepreneur
  room: L.61
  title: The blood, sweat, and tears (of pride) in bootstrapping
  speakers:
  - name: euphoricfall
    company: Pulsedive
    title: Cofounder & COO at Pulsedive
    bio: Grace works closely with defensive security and CTI practitioners all over the world, ranging from local consulting
      teams to enterprise operations. As a result, she has unique insights into the requirements and diverse traits of CTI
      success for individuals, teams, and organizations. On the weekend, she’s a hyper-serious cooperative board gamer and
      watercolorist.
    photo: /img/archive/2024/speakers/euphoricfall.webp
  description: This is a true and transparent recounting about one company's journey bootstrapping in a sea of media coverage
    and interest around VC-backed investments. This talk covers the creation and organic growth of a US-based SaaS threat
    intelligence startup. Drawing from firsthand experiences, the presentation sheds light on the challenges, triumphs, and
    invaluable lessons learned in going from very first customer to steady revenue.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '12:00'
  time_end: '12:30'
  track: Tech - Blue
  room: L2.84
  title: 'Trusted Types: DOM XSS Protection at Scale'
  speakers:
  - name: Jen Ozmen
    company: Google
    title: Software Engineer at Google's Web Security Team
    bio: Jen Ozmen is a Software Engineer at Google, where she works on the Information Security Engineering team, focusing
      on defense-in-depth mechanisms against common web vulnerabilities. She is passionate about building secure and reliable
      software, and she is always looking for new ways to improve the security of Google's web ecosystem. She is an active
      member of the tech community and enjoys sharing her knowledge through presentations at conferences like LibertyJS and
      Frontrunners DC.
    photo: /img/archive/2024/speakers/jen-ozmen.webp
  - name: Youssef Attia
    company: Google
    title: Software Engineer at Google's Web Security Team
    bio: Youssef Attia is currently a Software Engineer on Google's Web Security team. He recently graduated from Cornell
      CS May 2024. He was an on Google's Web Security Team and returned after graduating.
    photo: /img/archive/2024/speakers/youssef-attia.webp
  description: DOM XSS continues to be the most critical threat to web security. It occurs when an attacker can inject malicious
    code into a web page, which can then be executed by the victim's browser. Our current best defense against DOM XSS is
    Trusted Types, a browser-based runtime feature to limit the uses of DOM APIs (and limit the possibility of DOM injection).
    This talk will discuss why DOM XSS is a critical threat, how Trusted Types protects dangerous DOM APIs, Google's experience
    deploying Trusted Types across its web services, and challenges when adopting Trusted Types for the open source ecosystem.
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2024?playlist=1&file=B04_Trusted_Types_-_DOM_XSS_Protection_at_Scale.mp4
  recorded: false
- time_start: '12:00'
  time_end: '12:30'
  track: Tech - Other
  room: L2.85
  title: 'Caught in the Net: Using Infostealer Logs to Unmask CSAM Consumers'
  speakers:
  - name: Mariya Gedrich
    company: Recorded Future
    title: Threat Intelligence Analyst at Recorded Future
    bio: Mariya Gedrich is a Threat Intelligence Analyst at Recorded Future. She is a part of the Cyber Assessments and Trends
      (CAT) team, responsible for researching industry trends and creating strategic assessments across a broad range of topics.
      Mariya is originally from New York City, and completed her bachelor’s degree in Computer Science at Brown University.
    photo: /img/archive/2024/speakers/mariya-gedrich.webp
  description: In this proof of concept study, we delve into "logs" that were compromised by infostealer malware and obtained
    legally by Recorded Future. We use the large dataset of stolen data at our disposal to turn the tables on cybercriminals
    to identify criminal activity, arrive at geographic trends and make previously unseen connections between criminals.
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '12:00'
  time_end: '13:00'
  track: Tech - Red
  room: L.63
  title: 'Discover the Unseen: Azure Vulnerability Exploitation'
  speakers:
  - name: Scott Miller
    company: Accenture
    title: Scott Miller, Penetration Tester at Accenture
    bio: Scott Miller is a Penetration Tester at Accenture and performs vulnerability assessments and penetration tests for
      Accenture's clients, with his favorite domains being infrastructure and web. He enjoys traveling and attending conferences
      and recruiting events related to security and/or diversity and inclusion. Scott is a musician and singer and also enjoys
      fitness and doing activities like kayaking, hiking, and boxing.
    photo: /img/archive/2024/speakers/scott-miller.webp
  description: In the ever-expanding realm of cloud computing, understanding the vulnerabilities of widely used services is
    crucial for effective penetration testing. This talk will focus on finding and exploiting vulnerabilities in Microsoft
    Azure and Azure Active Directory (AD), now called Entra ID. We will start by understanding the architecture of Azure and
