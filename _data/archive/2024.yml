  title: 10 Things to Know Before You Work on Your Next M365 BEC
  speakers:
  - name: Ida Musheyev-Polishchuk
    company: Stroz Friedberg
    title: Senior Consultant at Stroz Friedberg's Digital Forensics and Incident Response
    bio: Ida Musheyev-Polishchuk is a Senior Consultant at Stroz Friedberg’s Digital Forensics and Incident Response practice.
      She leads and supports incident response matters including business email compromise, ransomware, and unauthorized access
      investigations. She holds several GIAC certifications including GCFE, GCFA, GCFR, and GCIH. Ida has expertise surrounding
      business email compromise investigations and has performed research on threat actor techniques during BECs.
    photo: /img/archive/2024/speakers/ida-musheyev-polishchuk.webp
  - name: Natasha Vij
    company: Stroz Friedberg
    title: DFIR Consultant at Stroz Friedberg, an Aon Company
    bio: Natasha Vij is a New York City based Consultant in the Digital Forensics and Incident Response practice of Stroz
      Friedberg, an Aon Company. She actively investigates incident response for clients, including Fortune 500 companies,
      non-profit organizations, government agencies.  Her skills include conducting forensic analysis of incident response
      matters including ransomware, business email compromise, and advanced persistent threat (APT) investigations. Natasha
      has expertise surrounding business email compromise investigations and regularly spends time researching how threat
      actor behaviors during these incidents.
    photo: /img/archive/2024/speakers/natasha-vij.webp
  description: As incident responders we investigate M365 Business email compromises ("BEC") daily. BEC's significantly disrupt
    operations, making swift and effective remediation essential. In this session, we will be discussing the top 10 insights
    gained from our extensive experience in investigating these matters. We will cover quick wins, data exfiltration techniques,
    and log anomalies to find malicious activity and IOCs. Attendees will leave with several tips and tricks to handle their
    next BEC confidently.
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2024?playlist=1&file=B01_10_Things_to_Know_Before_You_Work_on_Your_Next_M365_BEC.mp4
