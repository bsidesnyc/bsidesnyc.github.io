  room: L2.85
  title: The new SaaS cyber kill chain
  speakers:
  - name: Luke Jennings
    company: Push Security
    title: VP, R&D, Push Security
    bio: Luke Jennings is a security researcher from the UK. He spent most of his early career focused on red teaming and
      offensive security research at MWR, before moving on to developing new detection and response techniques and designing
      EDR software as the Chief Research Officer for Countercept. He has now pivoted away from the endpoint to focusing on
      emerging identity attacks as VP of R&D at Push Security.
    photo: /img/archive/2024/speakers/luke-jennings.webp
  description: In the past, we thought of cyber-attacks in terms of recon, port scanning, enumeration, vulnerability identification
    and exploitation. As the cat-and-mouse game of security continued, this morphed into an endpoint compromise-focused process.
    But with the remote working and SaaS revolution, the way organizations work has changed radically - so what does the cyber
    kill chain look like now?
  type: talk
  slides_url: null
  video_url: null
  recorded: false
