    photo: /img/archive/2024/speakers/brian-mchenry.webp
  - name: Lee Weiner
    company: TrojAI
    title: CEO, TrojAI
    bio: Lee is a board member, investor and the CEO of TrojAI, a company securing AI models.  He brings more than 25 years
