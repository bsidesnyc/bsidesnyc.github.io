      leading early and growth stage companies to initial public offering and beyond. Prior to joining TrojAI, Lee was a senior
      executive at Rapid7 for 11 years, leading products, engineering, and innovation as the company scaled from $40 million
      to over $750 million in revenue. Earlier, he held senior roles with LogMeIn, Symantec, IMlogic and Netegrity.
    photo: /img/archive/2024/speakers/lee-weiner.webp
