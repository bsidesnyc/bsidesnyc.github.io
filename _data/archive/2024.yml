  time_end: '17:00'
  track: Tech - Red
  room: L.63
  title: 'XZ Backdoor: Navigating the Complexities of Supply Chain Attacks Detected by Accident'
  speakers:
  - name: DevSecYoad
    company: Myrror Security
    title: DevOps Lead | Co-Founder & CEO at Myrror Security
    bio: 'I''m a DevOps engineer with over 14 years of experience in IT, DevOps, and DevSecOps.

      I''ve designed, built, and secured complex Cloud and On-Prem projects for both startups and large corporations.

      At Microsoft, I led a team of DevOps engineers, and we took part in the incident response when Microsoft was hit by
      the Solarwinds attack. This experience motivated me to start Myrror to address future software supply chain threats.

      I''m a cat enthusiast and enjoy hitting the drums in my spare time.'
    photo: /img/archive/2024/speakers/devsecyoad.webp
  description: 'Why did an individual, non-security-related person discover the XZ attack on such an important upstream open-source
    project as the XZ Utils? Four years after the SolarWinds attack and three years after the UA-Parser attack, we still see
    confusion about vulnerabilities, zero-days, and intentional attacks. In this session, we will spotlight a critical yet
    often overlooked area: compromised/malicious third-party libraries and CI/CD attacks.'
  type: talk
  slides_url: null
  video_url: https://archive.org/details/bsidesnyc2024?playlist=1&file=R10_XZ_Backdoor_-_Navigating_the_Complexities_of_Supply_Chain_Attacks_Detected_by_Accident.mp4
  recorded: false
