    bio: Passionate about technology, security and venture; Jonathan is Co-Founder and CEO of Impart Security. Prior to founding
      Impart, Jonathan was the VP of Product at Signal Sciences, an application security startup that sold to Fastly for $825M.
      Prior to Signal Sciences, Jonathan was product lead at Edgecast Networks, a global content delivery network that sold
