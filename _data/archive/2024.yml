  room: L.63
  title: 'BSidesNYC 0x04 Keynote: When Do We Get to Play On Easy Mode?'
  speakers:
  - name: Wendy Nather
    company: null
    title: Some Kind of Cyber Professional
    bio: 'Wendy Nather has been working in the industry for over 25 years.  She was previously Research Director at the Retail
      ISAC, where she was responsible for advancing the state of resources and knowledge to help organizations defend their
      infrastructure from attackers. Wendy was also Research Director of the Information Security Practice at independent
      analyst firm 451 Research.


      Wendy has served as a CISO in both the private and public sectors. She led IT security for the EMEA region of the investment
      banking division of Swiss Bank Corporation (now UBS), as well as for the Texas Education Agency. Wendy was inducted
      into the Infosecurity Europe Hall of Fame in 2021. She serves on the board of directors for Sightline Security, is a
      Senior Fellow at the Atlantic Council''s Cyber Statecraft Initiative, and a steering committee member for the IST Ransomware
      Task Force. She is based in Fort Collins, Colorado.'
    photo: null
  description: Many of us have been in the industry for a long time, and we keep seeing the same problems over and over again.
    We scramble to keep up with the new technology, and the long tail of the older tech stretches ever further behind us but
    never goes away. And what's that definition of insanity again? trying the same things over and over again, expecting a
    different result? It's time to look more critically at our assumptions and incentives, and maybe do a little table-flipping
    so that we can finally catch a break.
  type: keynote
  slides_url: null
  video_url: https://youtu.be/aE3VZZFC-wU?si=D9rD485kQhVIOqYg
  recorded: true
