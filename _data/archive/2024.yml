  title: 'Fortifying Active Directory: Combatting Misconfigurations'
  speakers:
  - name: Jeff
    company: null
    title: Penetration Tester
    bio: Jeff Tomkiewicz is a Offensive Security Engineer for a Healthcare Fortune 40 organization, where he specializes in
      network penetration testing, social engineering, and physical penetration testing. With a rich background as a 21-year
      Air Force veteran, Jeff has served in various capacities, including K9 handler and trainer, Intelligence, and Special
      Operations. Residing in Colorado Springs, CO, Jeff enjoys spanning interests outside of his professional life to include
      horror films, performing in improv shows, Muay Thai, gardening, and raising chickens.
    photo: /img/archive/2024/speakers/jeff.webp
  description: This presentation delves into the critical issue of common network misconfigurations in large organizations
    as highlighted by a joint cybersecurity advisory from the NSA and CISA. Focusing specifically on Microsoft Active Directory
    (AD), the talk explores the top 10 security vulnerabilities that cyber actors often exploit.
  type: talk
  slides_url: null
