    company: DataDome
    title: Co-founder & CEO, DataDome
    bio: 'Benjamin Fabre is the co-founder & CEO of DataDome, a leading AI-powered cyberfraud platform. A serial entrepreneur
      with a proven-track record, Benjamin boasts nearly 20 years’ experience in scalable web infrastructure, AI-powered data
      stream processing, & SaaS technologies.


      Under Benjamin''s leadership, DataDome has consistently been recognized as a leader in its field. The platform was named
      a Leader in The Forrester Wave™ Bot Management Software 2024 report, is consistently ranked as a G2 Leader, & was honored
      as one of G2’s Best Security Products of 2024. The company  has placed on both the Inc. 500 and Deloitte Technology
      Fast 500 lists.


      Before founding DataDome, Benjamin co-founded and led TrendyBuzz to a successful exit, with the company being acquired
      by LinkFluence. He is also an active member of the Forbes Technology Council, serves on the Executive Board of La French
      Tech New York & is an investor at Irregular Expressions.'
    photo: /img/archive/2024/speakers/ben.webp
  description: Join Benjamin Fabre, co-founder and CEO of DataDome, as he shares invaluable lessons learned from building,
    running and growing a cybersecurity company. Within 9 short years, Benjamin has grown DataDome from a small, French startup
    to a global, Series C-funded, award-winning company with headquarters in New York, Paris and Singapore.
