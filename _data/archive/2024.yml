  title: 'When Apps Attack: Hunting Traitorware and Rogue Microsoft 365 Apps at Scale'
  speakers:
  - name: Matt Kiely | HuskyHacks
    company: Huntress Labs
    title: HuskyHacks | Principal Security Researcher @ Huntress Labs
    bio: Learn. Teach. Build. Repeat. Matt Kiely (HuskyHacks) is a cybersecurity practitioner with 12 years of experience
      in offensive security research, malware reverse engineering, and network administration. Matt is a Principal Security
      Researcher at Huntress Labs, where he spends most of his time turning cybercriminals into examples. He is also the creator
      and instructor of Practical Malware Analysis & Triage (PMAT) available on TCM Security Academy and has a combined 40k
      students under his tutelage across the globe. Matt thru-hiked the 2200 miles of the Appalachian Trail in 2023 to prevent
      anyone from telling him to “touch grass” ever again.
    photo: /img/archive/2024/speakers/matt-kiely-huskyhacks.webp
  - name: Christina Parry
    company: Huntress
    title: Staff ThreatOps Developer @ Huntress
    bio: Christina Parry is a Staff ThreatOps Developer at Huntress. She is a TPM turned security engineer with 8+ years of
      experience in tech and security, specializing in detection engineering, automation, and open-source software. From her
      previous experiences at Morgan Stanley and Twitter/X, she has a penchant for building high-impact, scalable software
      solutions to automate everyday security workflows and elevate detection and response teams. She  loves to give back
      to the community by partnering with mentoring programs for women and underrepresented groups, giving talks to educate
      the community on open-source technologies, and can be found at BSides LV and NYC.
    photo: /img/archive/2024/speakers/christina-parry.webp
  description: Apps are not always your friend! In the Azure ecosystem, applications are a core part of the end user experience.
    But when these apps go rogue, what kinds of havoc ensues? How are applications leveraged by attackers to persist, infect,
    and bypass MFA? More importantly, how do we hunt these rogue apps down at scale?
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '16:00'
  time_end: '17:00'
