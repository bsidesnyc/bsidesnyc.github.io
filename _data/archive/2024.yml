    bio: Brian McHenry is the Global Head of Cloud Security Engineering at Check Point Software, leading all pre-sales and
      customer success functions for the CloudGuard portfolio. Formerly the VP of Product Management for WAF & API Security
      at F5, Brian is passionate about aligning product strategies and solutions to more secure business outcomes. He is also
