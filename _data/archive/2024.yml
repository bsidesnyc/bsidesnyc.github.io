  title: Raising money from and engaging with Angel Investment Syndicates
  speakers:
  - name: Anshu Gupta
    company: Silicon Valley CISO Investments (SVCI)
    title: Investor, Silicon Valley CISO Investments (SVCI)
    bio: Anshu Gupta is currently an investor with Silicon Valley CISO Investments (SVCI).  He is a senior level security
      executive with Fortune 500 security consulting experience at Ernst & Young and KPMG where he worked at companies like
      Microsoft, Salesforce, Oracle, Cisco, McAfee, Adobe, Yahoo, GAP, Kaiser among others. Based on advice from his mentors,
      he then moved on to get startup experience at Coupa Software (now a public company), HelloSign (acquired by DropBox),
      where he was the first security hire and had to build the whole security program from scratch and hire the information
      security team as well. Anshu served as the Head of Security Engineering at Varo Bank wherein he helped them at the first
      neobank to get FDIC approval and national OCC charter.  He also served as the VP, Security at Fast which was working
      on solving the consumer identity and checkout experience in the Ecommerce space. Anshu last served as the VP, Security
      and Privacy at SPAN.io
    photo: /img/archive/2024/speakers/anshu-gupta.webp
  description: This session will delve into how to successfully engage with and raise money from cyber angel investment syndicates.
    The session will also shed light into the typical due diligence process of investors and how to avoid common mistakes.
  type: talk
