  title: 'RE-Thinking: Modernizing the Malware Analyst'
  speakers:
  - name: Joseph Edwards
    company: SentinelOne
    title: Staff DFIR Investigator at SentinelOne
    bio: Joseph works in Digital Forensics and Incident Response at SentinelOne. Previously, he worked as Senior Malware Researcher
      at ReversingLabs, focusing on malware delivery in uncommon file formats and supply chain threats. He has performed investigations
      and malware analysis at manufacturing and technology organizations, and his research interests include industrial control
      systems malware, IoT device forensics and especially evasive malware.
    photo: /img/archive/2024/speakers/joseph-edwards.webp
  description: As malware analysts, the current mode of static reverse engineering in our space has us in a constant game
    of catch-up against unfriendly compilers, virtualization-based obfuscators and large binaries that generally break our
    tools and frustrate us. Our thinking is rooted in quaint beliefs about always being able to reconstruct original source
    code. How can we completely change our approach, and what should the next generation of malware analysis look like?
  type: talk
  slides_url: null
