  title: 'Local to Global: Tracing Kimsuky''s Network Infra Adaptations in a Changing Geopolitical Landscape'
  speakers:
  - name: Dmitry
    company: null
    title: Research Specialist
    bio: Dmitry Bestuzhev is a Cybersecurity Expert with over 20 years of experience in the industry and education sectors.
      He has held senior positions at BlackBerry (Senior Director, CTI) and Kaspersky (Head of GReAT, Latin America), leading
      cybersecurity teams. Currently, he conducts independent research and supports non-profit educational initiatives.
    photo: /img/archive/2024/speakers/dmitry.webp
  description: We ran into the North Korean APT group Kimsuky's network infrastructure evolution from 2019 to 2024, correlating
    changes with major geopolitical events, focusing on intel related to South Korean policies, international perspectives
    on NK, and advanced military technologies. Our paper reveals adaptable approach to command and control (C2) infrastructure
    through major events between NK, CN, and RU.
  type: talk
