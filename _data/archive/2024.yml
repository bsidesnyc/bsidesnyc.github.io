  title: My Journey from a $99K Cybersecurity Research Project to a Commercial Product and Acquisition
  speakers:
  - name: Anita D'Amico
    company: Cotopaxi Consulting
    title: Advisor to security startups and investors, Software supply chain strategist
    bio: 'Dr. Anita D''Amico is President of Cotopaxi Consulting, which is dedicated to technology commercialization of cybersecurity
      innovations. She specializes in accelerating adoption of technologies that significantly impact software supply chain
      security.  As a Vice President at Synopsys Software Integrity Group, Anita led the Products team responsible for their
      entire industry-leading AppSec product portfolio. She also led their software supply chain security and SBOM business
      strategy, and their product strategy for secure adoption of AI in software development.


      Anita joined Synopsys when they acquired her startup, Code Dx, Inc. She is an innovator who has successfully completed
      the journey from idea to prototyping and early sales, and then crossed the chasm into a successful commercial product.
      As founder and CEO of Code Dx, Inc. she grew the business from a 6-month research project into a venture-funded commercial
      supplier of B2B AppSec software, and acquisition by Synopsys.'
    photo: /img/archive/2024/speakers/anita-d-amico.webp
  description: The speaker shares her story and lessons learned accumulated during an 11-year journey that began with a $99,000
    6-month government-funded research project and ended with her selling her startup to a publicly-traded company and serving
    as VP of Products at the U.S.'s leading provider of AppSec solutions.
  type: talk
  slides_url: null
  video_url: null
