  title: Securing a Generative AI Implementation
  speakers:
  - name: eyrsec
    company: Zendesk
    title: Senior Product Security Engineer, Zendesk
    bio: Nandita is a security professional with over 8 years of experience across security consulting and product security.
      She enjoys brainstorming and discussing all things security - technologies, tools and processes - especially pertaining
      to web and mobile applications, threat modeling, and secure development training. At present, she works at Zendesk as
      a Senior Product Security Engineer. This allows her to dabble across security engagements, penetration testing, security
      champions program, and security tooling. Her current focus is on API security, and strategizing and implementing secure
      solutions at scale. Nandita lives in Herndon, VA where she enjoys running, and hiking with her family.
    photo: /img/archive/2024/speakers/eyrsec.webp
  description: This talk will address an implementation of generative AI, with the goal of understanding what this means for
    an organization's security posture, and managing associated risk. The first 15 minutes of the talk will focus on a demo
    app showing an integration of generative AI as a product feature. The rest of the session will focus on managing risk
    associated with AI/ML implementations with a high-level threat model.
