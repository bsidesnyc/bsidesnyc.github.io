  title: They Don’t Want to Talk to Sales—So Let the Community Sell for You
  speakers:
  - name: Mariana Padilla
    company: HACKERverse.ai
    title: CEO, HACKERverse.ai
    bio: 'Mariana Padilla is the Co-Founder and CEO of HACKERverse.ai, a platform redefining how cybersecurity software gets
      evaluated—by turning months-long PoC cycles into real-time, self-serve simulations. She previously scaled her marketing
      agency to over $1MM in annual revenue and now brings that same strategic focus to transforming enterprise software sales.


      Mariana’s work has earned her a spot on the front cover of the 2025 Most Innovative Cincinnati Startups to Watch and
      features on over two dozen industry podcasts. She was also named a “Woman to Watch in Cybersecurity” by Authority Magazine
      and received scholarships from WiCyS and WISP for her leadership in driving diversity in tech.


      She specializes in go-to-market, sales strategy, and inclusive innovation—and is passionate about making the cybersecurity
      space more transparent, efficient, and engaging for both buyers and vendors.'
    photo: /img/archive/2025/speakers/mariana-padilla.webp
  description: 'Today’s buyers are 70% of the way through their purchasing process before they ever reach out to sales. They’re
    comparing notes in Slack groups, lurking in Reddit threads, and following peers- not filling out demo forms. So if your
    growth strategy starts with “Talk to Sales,” you’ve already lost.

    This session will explore how startups can turn community into a core GTM motion- one that builds trust, accelerates deals,
    and lowers CAC. You’ll learn how to design a community that drives real business value by activating power users, surfacing
    product validation, and creating an environment where your customers do the selling for you.

    We’ll walk through actionable frameworks, real examples, and the metrics that matter when aligning community with your
    growth strategy.

    Who it’s for: Founders, GTM leaders, and community builders looking for a smarter path to scale- one that matches how
    people actually buy today.'
  type: talk
  slides_url: null
  video_url: https://www.youtube.com/watch?v=acGfp2vCGIs
  recorded: true
- time_start: '12:00'
  time_end: '12:55'
  track: Tech - Blue
  room: Tech - Blue
  title: 'Unseen in the Stack: Mapping Hidden Java Dependencies for Real-World Defense'
  speakers:
  - name: Oron Gutman
    company: Hopper Security
    title: Hopper Security, CTO
    bio: Oron is the CTO and co-founder of Hopper, channeling 14 years of vulnerability research into building secure, elegant
      systems. A two-time Israel Defense Prize winner and former Unit 8200 section lead, he brings precision to everything
      he does, whether architecting software, plotting chess moves, or selecting the perfect bottle of whiskey.
    photo: /img/archive/2025/speakers/oron-gutman.webp
  description: 'Modern Java applications often include dependencies that aren''t declared, aren''t visible, and aren''t scanned.
    Through shading, repackaging, and renaming, vulnerable libraries can hide inside legitimate artifacts, rendering traditional
    SCA tools blind to real risk. These hidden dependencies are increasingly common in enterprise code, but rarely discussed
    or addressed systematically.

    This talk presents research on how shaded and repackaged libraries propagate in the wild, based on analysis of real Maven
    repositories and build artifacts. We’ll share anonymized examples of hidden vulnerability paths, show how they evade detection,
    and propose a repeatable methodology for defenders to uncover and address them. You’ll learn techniques like bytecode
    fingerprinting, call graph analysis, and symbol introspection that can turn opaque artifacts into observable objects without
    relying on vendor tooling or runtime agents.

    If you’ve ever been surprised by a vulnerability in a dependency you didn’t know you had, this talk is for you.'
