  title: 'Down the Drain: Unpacking TON of Crypto Drainers'
  speakers:
  - name: Elizaveta Mikheeva
    company: Neplox
    title: Cybersecurity Researcher, Neplox
    bio: 'Elizabeth (qwqoro) of the Neplox team is a Cybersecurity Researcher, who strongly believes that Web3 Security must
      be Research-powered, and therefore daily explores curious corners of the information security world: participates in
      penetration tests of Web2 / Web3 applications, dissects malware source code and looks for in-the-wild vulnerabilities
      and threats in various products, ranging from E-mail Injections to phishing via IoT Devices.


      She has written research articles and given talks at International conferences and meetups, and her field of interest
      includes Web3 Ecosystems, Web Application Security, Red Teaming and Malware Analysis.'
    photo: /img/archive/2025/speakers/elizaveta-mikheeva.webp
  description: 'We have laid our hands on the source code of a few Crypto Drainers designed specifically to steal native coins,
    NFTs and Jettons on the TON Network, and dissected them to better understand what flaws of legitimate products they exploit
    in order to appear less suspicious.

    Apart from malware samples themselves, we are going to discuss: •  Forgery of DApp''s origin and data •  Legitimate Wallet
    Impersonation with the use of UI Redressing possibilities •  Behavior control: Events tracking and Forcing actions •  Data
    control: Local storage and Bridge MitM'
