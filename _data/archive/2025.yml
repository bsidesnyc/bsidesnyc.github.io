    company: Cloudflare
    title: Principal Solutions Engineer at Cloudflare Focused on App Sec and Bots
    bio: 'With over 25 years of experience as a Solutions Engineer, I am passionate about helping enterprise customers achieve
      their goals of enhancing web performance, security, and reliability. As a Lead Solutions Engineer at Cloudflare, I leverage
      my technical skills, industry knowledge, and customer-centric approach to deliver cloud-native solutions that meet the
