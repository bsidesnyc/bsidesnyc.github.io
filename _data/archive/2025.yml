  speakers:
  - name: Emily Leidy
    company: SpecterOps
    title: Managing Consultant at SpecterOps
    bio: Emily is a well-rounded information security consultant and defensive security practitioner. She has over 10 years
      of experience in cybersecurity with expertise in detection engineering, purple teaming, attack surface reduction, threat
      modeling, cybersecurity policy, and adversary tactics. Emily has taught at several security conferences, including Black
      Hat. Before joining SpecterOps, Emily worked with multiple large federal agencies helping them prioritize and remediate
      critical vulnerabilities and proactively defend against potential cyber attacks. Prior to that, she developed agency-wide
      compliance requirements and wrote the Interim Authority to Test policy in the National Security Systems division at
      the Department of Homeland Security.
    photo: /img/archive/2025/speakers/emily-leidy.webp
  description: 'Active Directory Certificate Services (ADCS) have become a critical yet often overlooked attack vector in
    enterprise environments. Following the high-profile "Certified Pre-Owned" research, organizations are increasingly seeking
    pragmatic approaches to remediate certificate-based privilege escalation vulnerabilities (ESC1–ESC8).

    This session introduces a structured approach to ADCS security using BloodHound Enterprise. ADCS remediation empowers
    security teams to identify, prioritize, and remediate ESC paths. Attendees will learn how this methodology integrates
    attack path analysis, strategic remediation planning, and validation to reduce real-world risk.'
