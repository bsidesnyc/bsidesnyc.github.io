  title: 'From CISA to Starting Up: Shifting Secure by Design at Scale'
  speakers:
  - name: Jack Cable
    company: Corridor
    title: CEO & Co-Founder at Corridor
    bio: Jack Cable is a hacker who works at the intersection of cybersecurity and public policy, currently the CEO and Co-Founder
      of Corridor. Prior to that, Jack served as a Senior Technical Advisor at the Cybersecurity and Infrastructure Security
      Agency (CISA), where he helped lead the agency’s Secure by Design initiative. Before CISA, Jack worked as a TechCongress
      Fellow for the Senate Homeland Security and Governmental Affairs Committee, advising Chairman Gary Peters on cybersecurity
      policy, including open source software security. He previously worked as a Security Architect at Krebs Stamos Group.
      Jack is a top bug bounty hacker, having identified over 350 vulnerabilities in hundreds of companies. After placing
      first in the Hack the Air Force bug bounty challenge, he began working at the Pentagon’s Defense Digital Service. Jack
      studied computer science at Stanford University and has published academic research on election security, ransomware,
      and cloud security.
    photo: /img/archive/2025/speakers/jack-cable.webp
  description: 'How do you shift an entire industry? This talk explores my journey from leading the Secure by Design initiative
    at CISA to founding Corridor, an AI assistant for product security teams. This work stems from the core realization that
    most cyberattacks are preventable—not because we need better defenders, but because software is still shipped insecure
    by default. Software companies have the ability to prevent entire classes of vulnerabilities, and addressing this is equal
    parts tech and policy.

    I’ll share lessons from the policy side – starting the Secure by Design pledge, writing legislation, and shaping executive
    orders; the business side – the process of starting a startup, fundraising, and finding product-market fit; and the technical
    side – how we use AI to understand entire codebases and aid product security teams with otherwise-manual workflows.'
