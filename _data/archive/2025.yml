  title: 'The Log Rings Don’t Lie: Historical Enumeration in Plain Sight'
  speakers:
  - name: Bleon Proko
    company: null
    title: Security Engineer
    bio: 'Bleon is an Info-sec passionate about Infrastructure Penetration Testing and Security, including Active Directory,
      Cloud (AWS, Azure, GCP, Digital Ocean), Hybrid Infrastructures, as well as Defense, Detection and Thread Hunting. He
      has presented topics related to Cloud Penetration Testing and Security in conferences like BlackHat USA, Europe and
      Sector, DEF CON, SANS Pentest Hackfest Hollywood and Amsterdam, as well as several BSides on USA and Europe.

      His research include Nebula, a Cloud Penetration Testing Framework (https://github.com/gl4ssesbo1/Nebula) and other
      blogs, which you can also find on his blog (blog.pepperclipp.com). He is also the author of YetiHunter, DetentionDodger
      and Ransomwhen (https://github.com/Permiso-io-tools/[DetentionDodger | YetiHunter | Ransomwhen]).'
    photo: /img/archive/2025/speakers/bleon-proko.webp
  description: Logs keep a lot of data. Most of them are events, but events have other data in them. Source IP, Source Identity,
    Target Resource, User Agent, Request and Response Parameters, etc. Which one of them are important? All of them of course.
    Logs are important to a defender. And they are a needle in the foot of the attacker. But why do they have to be? Why can't
    the attacker actually profit from logs? What if the attacker can achieve enumeration, C2 capabilities, exfiltration, download
    through logs? This presentation will go through actually that. How can an attacker utilize Logs to attack a Cloud Infrastructure.
