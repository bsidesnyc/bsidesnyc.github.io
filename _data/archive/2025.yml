    company: ELLIO Technology
    title: Cybersecurity Expert@ ELLIO Technology, President of the Anti-Malware Testing Standards Organization (AMTSO).
    bio: 'Vlad is the co-founder and cybersecurity expert at ELLIO and President of the Anti-Malware Testing Standards Organization
      (AMTSO).


      A true cybersecurity enthusiast, Vlad’s passionate about network security, IoT, and cyber deception. Before ELLIO, he
      founded and led the Avast IoT Lab (now Gen Digital), developing security features and researching IoT threats. He has
      spoken at many conferences, including Web Summit and South by Southwest (SXSW), where he demonstrated IoT vulnerabilities.'
    photo: /img/archive/2025/speakers/vlad-iliushin.webp
  description: 'The goal of this interactive workshop is to equip participants with a hands‑on understanding of modern passive
    network fingerprinting techniques - JA3, JA3N, JA4, p0f and MuonFP - and the ability to generate, interpret and apply
    these fingerprints in real‑world defensive workflows.

    Key Takeaways: Understanding the Evolution of Fingerprinting: Why we moved from p0f to MuonFP and from JA3 to JA4. Hands-on
    capturing fingerprints: generating JA3/JA4/p0f/MuonFP fingerprints. Understanding the limitations of fingerprints.'
