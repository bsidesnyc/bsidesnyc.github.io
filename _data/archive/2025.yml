  speakers:
  - name: Christian Hyatt
    company: risk3sixty
    title: CEO & Founder @ risk3sixty
    bio: 'With experience overseeing 2000+ engagements, Christian is widely considered one of the foremost experts on cybersecurity,
      GRC, and compliance around the globe. Renowned as a highly regarded keynote speaker and thought leader, Christian has
      worked with entrepreneurs, CEOs, corporate executives, and security experts across Europe, Asia, and the United States.


      As the CEO and Co-founder of risk3sixty, Christian’s team helps many of the world’s leading technology organizations
      certify, build, and manage security programs challenged with compliance initiatives like SOC 2, ISO 27001, PCI DSS,
      HITRUST, and also performs continuous penetration testing.


      Under Christian’s leadership, risk3sixty has been named 3x Consulting Magazine’s Best Firms to Work For, 5x Atlanta’s
      Fastest Growing companies, and 5x Atlanta’s Best Places to Work.


      Christian is the best selling author of "Security Team Operating System" and has an M.B.A. from Georgia Tech and a B.B.A.
      from the University of Georgia.'
    photo: /img/archive/2025/speakers/christian-hyatt.webp
  description: 'This talk is a transparent account of my attempt to build a “good business”—one that is both financially successful
    and deeply ethical. It’s a transparent account of our journey from starting with nothing to achieving over $10M in revenue,
    and it’s a guide for anyone seeking to create a business that stands for integrity, craftsmanship, and meaningful impact.
    By reflecting on our story, sharing hard-earned lessons, and offering a roadmap.

    I hope the audience will gain inspiration, clarity, and confidence to embark on their own entrepreneurial journey. They’ll
    find comfort in knowing that the road to success is long and challenging—but entirely possible. With a roadmap to avoid
    common pitfalls and the motivation to persevere, readers will feel equipped to build their own “good business,” grounded
    in purpose, integrity, and sustainable success.'
