  speakers:
  - name: Alex Chantavy
    company: SubImage
    title: Co-founder & CEO at SubImage
    bio: 'Alex Chantavy is the co-founder and CEO of SubImage, a cloud security startup backed by Y Combinator. He is the
      co-creator of Cartography, a popular open-source security graph tool.


      In prior roles, he architected and built Lyft''s vulnerability management platform, led penetration tests for Microsoft''s
      Red Team, and worked on [REDACTED] at the NSA.'
    photo: /img/archive/2025/speakers/alex-chantavy.webp
  - name: Kunaal Sikka
    company: SubImage
    title: Co-founder & President at SubImage
    bio: Kunaal Sikka is the Co-founder and President of SubImage (YC W25), a startup building clear maps for complex cloud
      environments. Previously, he was a Member of Technical Staff at Anthropic and Staff Engineer at Lyft, reporting directly
      to the CISO. At Anthropic he focused on hardening infrastructure, scaling access management, and did the initial security
      review for MCP. At Lyft, he led the development of the company's next-generation SIEM, insider abuse detection platforms,
      and helped architect the vulnerability management program. He graduated from the University of Washington with a computer
      science degree in two years and grew from new grad to Staff Engineer at Lyft in 4 years.
    photo: /img/archive/2025/speakers/kunaal-sikka.webp
  description: 'Imagine going through Y Combinator surrounded by startups building AI agents for dog walkers, while you’re
    trying to sell IAM hygiene to the Fortune 500.

    On our acceptance call to the world’s most famous startup accelerator, we were told we were the first company in the batch
    that didn’t use the word “LLM” in our pitch. Go us.

    This talk is our "we were the weird kid" story from the YC Winter 2025 batch: what it felt like to build a security company
    in a culture steeped in growth hacks, virality, and AI everything.

    If you''ve ever dreamed about quitting your corporate job to start your own thing -- or watched from the sidelines while
    others made money off your open source project -- this is the talk for you.'
  type: talk
