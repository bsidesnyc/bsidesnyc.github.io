  speakers:
  - name: Mauricio Velazco
    company: null
    title: Principal Security Researcher
    bio: Mauricio Velazco (@mvelazco) is a Principal Security Researcher Engineer within the Microsoft Security AI Research
      team. Prior to Microsoft, he was Threat Researcher at the Splunk Threat Research Team. Mauricio has presented and hosted
      workshops at conferences like Defcon, BlackHat Arsenal, Derbycon, BSides and SANS. His aread of focus include detection
      engineering, adversary simulation and threat hunting.
    photo: /img/archive/2025/speakers/mauricio-velazco.webp
  description: Adversaries map and navigate cloud attack paths by chaining misconfigurations, over-privileged principals,
    and exposed secrets in pursuit of privilege escalation and broader objectives. In this talk, we explore core attack primitives
    in Azure, Entra ID, and Microsoft 365, demonstrate how to simulate end-to-end attack chains, and analyze the resulting
    telemetry to uncover the traces these attacks leave behind.
