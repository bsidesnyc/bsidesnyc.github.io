  title: 'Infrastructure as Remote Code Execution: How to abuse Terraform to elevate access'
  speakers:
  - name: Mike McCabe
    company: null
    title: null
    bio: 'Michael McCabe is the founder and President of Cloud Security Partners.  He founded Cloud Security Partners in 2017
      where he uses his 15 years of experience to help create and implement security solutions for clients. Michael’s focus
      on Cloud Native software security coupled with his experience in Cloud Infrastructure and Security enables Mike to help
      companies navigate their security challenges by creating unique and client-tailored solutions.

      Michael has led teams within startups and large financial institutions, guiding them through their security journeys.
      Michael’s experience in secure code review and dynamic security testing allows him to help clients identify their risk
      across applications and infrastructure alike.

      Michael is a chapter leader of the OWASP Northern Virginia chapter, where he coordinates speakers and meetups which
      hosted industry-leading experts. In a addition to that, he has spoken at numerous conferences about subjects across
      Application Security, Cloud Security and more. He is also the co-host of the Relating to DevSecOps podcast focusing
      on how to create security solutions that work for real world problems.

      When not chasing his two young sons around, he enjoys biking and being an amateur mechanic.'
    photo: /img/archive/2023/speakers/mike-mccabe.webp
  description: This talk will focus on ways to abuse the use of Terraform to elevate privileges, expose data, and gain further
    footholds in environments from a developer's perspective. We'll cover the common uses of Terraform and how a malicious
    actor could abuse Terraform and even bypass security controls to execute unapproved code. This talk will include multiple
    demos of ways to exploit Terraform cloud.
