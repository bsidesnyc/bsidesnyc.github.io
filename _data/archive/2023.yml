  title: Elements of an Effective Software Supply Chain Strategy
  speakers:
  - name: Anita D'Amico
    company: null
    title: null
    bio: Dr. Anita D’Amico is Vice President of Cross-Portfolio Solutions and Strategy at Synopsys Software Integrity Group,
      where she is responsible for software supply chain risk management. Prior to that, she was CEO of Code Dx, Inc., an
      application security startup.  Her roots are in experimental psychology and human factors. She has conducted extensive
      research and published work on the intersection of technology and human decision making, including how to visualize
      complex cybersecurity data.  She got her start in cybersecurity at Northrop Grumman, where she launched its first Information
      Warfare team. Anita was named as one of "100 Fascinating Females Fighting Cybercrime” in the book “Women Know Cyber.”
    photo: /img/archive/2023/speakers/anita-d-amico.webp
  description: Are you developing software? If so, there's a good chance that generating a Software Bill of Materials (SBOM)
    is in your future. Fears of vulnerabilities in the software supply chain have accelerated demands for SBOMs by customers.
    This presentation will explain what an SBOM is, who is asking for them, what they are going to do with them, the standard
    formats in which they are issued, and how to generate them. It will also describe how SBOMs fit into vulnerability disclosure
    and remediation processes and add transparency to the software supply chain.
  type: talk
