    title: null
    bio: Dennis Murphy started his career in 1993 as a Control System Engineer, specializing in designing, installing, and
      maintaining process automation networks in dozens of industry segments, including the Electric Utility sector. In 2005,
      Mr. Murphy shifted his focus to from designing to securing control system networks, working on R&D projects to secure
      US critical infrastructure as a member of BAE Systems. In 2015, Mr. Murphy joined SecurityMatters as the first US employee,
