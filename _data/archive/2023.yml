  title: xIoT Hacking Demonstrations & Strategies to Disappoint Bad Actors
  speakers:
  - name: Brian Contos
    company: null
    title: null
    bio: 'Brian Contos, Chief Strategy Officer, Sevco Security

      With two IPOs & eight acquisitions, Brian has helped build some of the most successful security companies in the world.
      He has over 25 years in the security industry as a security company entrepreneur, board advisor, investor, and author.
      After getting his start with the Defense Information Systems Agency (DISA) and later Bell Labs, Brian began the process
      of building security startups and taking multiple companies through successful IPOs and acquisitions, including Riptech,
      ArcSight, Imperva, McAfee, Solera Networks, Cylance, JASK, Verodin, and Mandiant.

      Brian has worked in over 50 countries across six continents. He authored the book Enemy at the Water Cooler and co-authored
      Physical & Logical Security Convergence with former NSA Deputy Director William Crowell. He was featured in the cyberwar
      documentary 5 Eyes alongside General Michael Hayden, former NSA, and CIA Director. Brian writes for Forbes and regularly
      presents at conferences like Black Hat, RSA, OWASP, and BSides.'
    photo: /img/archive/2023/speakers/brian-contos.webp
  description: We'll demonstrate several hacks against xIoT, or Extended Internet of Things, devices. For those who would
    say, "But they're just security cameras monitoring the parking garage, wireless access points in the cafeteria, or PLCs
    controlling robotic welding arms; what harm can they cause?" - this will illuminate that harm. We'll share stories from
    the trenches involving cybercriminals, nation-state actors, and defenders. Our presentation will detail findings from
    over six years of xIoT threat research spanning millions of production devices in enterprises and government agencies
    around the world. We'll identify various steps organizations can take to mitigate risk while embracing a Things-connected
    world.
  type: talk
  slides_url: null
  video_url: https://www.youtube.com/watch?v=Yd80934zPkg
