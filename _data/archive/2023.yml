      and playbooks. In 2021, Mr. Murphy joined National Grid as the Lead OT Security Engineer for the Digital Substation
      group in the US, responsible for securing OT networks with IDS systems and adapting IT-based security solutions to install
      an edge compute element to field sites. Mr. Murphy, a father of three who currently resides in New Hampshire with his
      wife, is an active member of the Appalachian Mountain Club, seeking to hike all forty-eight 4000-ft. peaks in NH. Mr.
