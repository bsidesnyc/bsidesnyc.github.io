  title: 'It''s the Economy, Stupid: Tackling technical debt in times of economic uncertainty'
  speakers:
  - name: Ariel Robinson
    company: null
    title: null
    bio: After a multi-year hiatus of zoom birthdays and remote happy hours, nationally-recognized security speaker Ariel
      Robinson is back on the circuit with a host of new talks, trainings, and pandemic puppy pics. (He was planned before
      the pandemic, okay?) With an academic background in cognitive science and linguistics, Ariel has built a career out
      of using pictures and small words to translate highly technical concepts between vastly different stakeholders (most
      of whom have little in common besides appearing vaguely humanoid). Ariel's work has brought her face-to-face with some
      of society's most dangerous members, from Marines, to lawyers, to seven year old's at a birthday party after cake. Outside
      of her current role as a senior security product manager, Ariel draws, paints, and climbs really big rocks.
    photo: /img/archive/2023/speakers/ariel-robinson.webp
  description: No matter the number of weeks between my submitting this abstract and you reading it, we've probably seen about
    as many wrong market predictions as we've seen CVEs. Economic uncertainty is... not great, but it does give security teams
    and CEOs a potential common language-- if we can learn to speak their dialect. In this crash course, you'll learn how
    to explain true zero trust to your boss's boss's boss so it actually gets funded, and maybe-- just maybe-- we can start
    tackling 30+ years of market-driven technical debt. Come for the hot takes, stay for the strategy.
  type: workshop
  slides_url: null
  video_url: null
  recorded: true
