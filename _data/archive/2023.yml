    company: null
    title: null
    bio: A chaotic good lead security consultant with Nettitude.  Who tends to get distracted with hardware, malware and trying
      to do well to those around me. Over my career I have held positions in most areas of IT, such as a programmer, SOC operator,
      network, and system administrator. I currently hold a number of industry certificates that allows me to bypass HR role
      qualification filters. When I'm not on my computer, I pretend to be a farmer and beekeeper.
