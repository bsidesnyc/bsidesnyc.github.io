  track: Talk - Blue
  room: L2.84
  title: Hunting for RomCom RAT inside of the context of the war in Ukraine
  speakers:
  - name: Dmitry
    company: null
    title: null
    bio: 'Dmitry Bestuzhev is BlackBerry''s Senior Director, leading the Cyberthreat Intelligence team responsible for tracking
      large-scale cyber incidents, espionage, and cyber-crime-motivated campaigns.


      In addition to producing contextual cyberthreat intelligence reports, he prepares analytical articles and forecasts.
      He is a trainer in various topics: threat hunting, malware analysis, threat intelligence, and OpSec. Dmitry frequently
      presents in educational initiatives, webinars, and international security events.

      Before joining BlackBerry, Dmitry oversaw the Global Research and Analysis Team in Latin America in anti-malware and
      threat intelligence research of financially motivated attacks. He has more than 20 years of experience in different
      fields of cybersecurity.'
    photo: /img/archive/2023/speakers/dmitry.webp
  - name: Jacob Faires
    company: null
    title: null
    bio: Jacob Faires is a Senior Threat Researcher with BlackBerry’s Threat Research & Intelligence team. Jacob collaborates
      with data scientists, engineers, and intelligence analysts to actively monitor threats and develop cutting edge research
      focused internally and externally on the evolving threat landscape. Jacob has nearly two decades of experience in the
      information and technology security sector. Prior to joining BlackBerry, Jacob was a Senior Threat Researcher with NTT’s
      Global Threat Intelligence Center (GTIC) where he tracked threat actors and advanced persistent threats (APTs), incident
      response, extended detection and response (XDR) data, and data net flow analysis to effectively identify threat actors
      and provide detection to NTT clients.
    photo: /img/archive/2023/speakers/jacob-faires.webp
  description: A few hours before the Ukraine war officially began, apparently, a Russian-sponsored wiper campaign occurred.
    During the following weeks and months, we saw several operations and weapons used against Ukraine. One of them is the
    RomCom RAT. The threat actor behind it used different initial access schemes to compromise the Ukrainian military and
    governmental entities. In our presentation, we will describe how we hunted it each time the threat actor changed its network
    infrastructure and how the RomCom RAT works inside the TO (theater of operations).
  type: talk
  slides_url: null
  video_url: null
  recorded: false
- time_start: '10:00'
  time_end: '10:50'
  track: Talk - Other
  room: L2.85
  title: The Rise and Fall of the Trickbot and Conti Empires
  speakers:
  - name: Alex Holden
    company: null
    title: null
    bio: Alex Holden is the founder and CISO of Hold Security, LLC. Under his leadership, Hold Security played a pivotal role
      in information security and threat intelligence, becoming one of the most recognizable names in its field. Mr. Holden
      researches minds and techniques of cyber criminals and helps our society to build better defenses against cyber-attacks.
    photo: /img/archive/2023/speakers/alex-holden.webp
  description: In a post-mortem analysis of Trickbot/Conti gangs, I'll detail our unique view into their operations, methods,
    and lives. Real time access to Conti Leaks was just one of many tools in our arsenal. Our work and unique vantage point
    has prevented a significant portion of the gang's crimes. This story is about our journey, process, and insights into
    one of the most notorious cybergangs of our time.
  type: talk
  slides_url: null
  video_url: https://www.youtube.com/watch?v=PDgxd3u0bm4
  recorded: true
- time_start: '10:00'
  time_end: '10:50'
  track: Talk - Red
  room: L.63
  title: 'Low Code High Risk: Enterprise Domination via Low Code Abuse'
  speakers:
  - name: Michael Bargury
    company: null
    title: null
    bio: Michael Bargury is a security researcher passionate about all things related to cloud, SaaS and low-code security,
      and spends his time finding ways they could go wrong. He is the Co-Founder and CTO of Zenity, where he helps companies
      secure their low-code/no-code apps. In the past, he headed security product efforts at Azure focused on IoT, APIs and
      IaC. He also leads the OWASP low-code security project and writes about it on DarkReading. Michael is a regular speaker
      at RSAC, OWASP, BSides and DEFCON.
    photo: /img/archive/2023/speakers/michael-bargury.webp
  description: 'Why focus on heavily guarded crown jewels when you can dominate an organization through its shadow IT? Low-Code
    applications have become a reality in the enterprise, with surveys showing that most enterprise apps are now built outside
    of IT, with lacking security practices. Unsurprisingly, attackers have figured out ways to leverage these platforms for
    their gain.


    In this talk, we demonstrate a host of attack techniques found in the wild, where enterprise No-Code platforms are leveraged
    and abused for every step in the cyber killchain. You will learn how attackers perform an account takeover by making the
    user simply click a link, move laterally and escalate privileges with zero network traffic, leave behind an untraceable
    backdoor, and automate data exfiltration, to name a few capabilities. All capabilities will be demonstrated with POCs,
    and their source code will be shared.


    Next, we will drop two isolation-breaking vulnerabilities that allow for privilege escalation and cross-tenant access.
    We will explain how these vulnerabilities were discovered and assess their pre-discovery impact.


    Finally, we will introduce an open-source recon tool that identifies opportunities for lateral movement and privilege
    escalation through low-code platforms.'
  type: talk
  slides_url: null
  video_url: https://www.youtube.com/watch?v=j0uUpsuUoFQ
  recorded: true
