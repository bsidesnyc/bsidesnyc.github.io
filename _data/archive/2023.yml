  title: Closing the Gap vs Adversaries With Community Resources
  speakers:
  - name: Ian Davila
    company: null
    title: null
    bio: 'Ian Davila is a Lead Adversary Emulation Engineer for Tidal Cyber who is passionate about helping organizations
      adopt a Threat-Informed Defense. Before joining Tidal Cyber, Ian was a Cyber Security Engineer for The MITRE Corporation.

      Ian advanced MITRE ATT&CK® where he researched, developed, and reviewed techniques for the Enterprise domain as a Technique
      Research Lead. He also supported the software development team of ATT&CK. Ian was part of ATT&CK Evaluations for two
      Enterprise offerings where he led evaluations and emulated malware used by adversaries.

      Ian began his career in Cyber Security in 2015 by competing in CTFs while completing his Bachelor of Science in Computer
      Science from the University of Puerto Rico, Rio Piedras. He was a Research Assistant for the University of Puerto Rico
      and interned at the National Institute of Standards and Technology and Carnegie Melon University. After completing his
      Bachelor of Science, he obtained a Master of Science in Information Security from Carnegie Melon University in 2020
      while being an intern for The MITRE Corporation.'
    photo: /img/archive/2023/speakers/ian-davila.webp
  description: Identifying adversary behaviors that matter to your organization has always been a difficult task. The purpose
    of this talk is to help close that gap by exploring adversary behaviors communicated through MITRE ATT&CK and Tidal Cyber.
    Traditionally, teams have had to wade through large volumes of unstructured CTI to surface the most relevant groups, software,
    or campaigns, adding so much time that the exercise becomes prohibitive. We will demo and show how structured metadata
    around threats, such as motivations, sectors, and victim locations unlocks achievable "threat profiling", and how pivoting
    to relevant techniques, procedures, defenses, and tests allows teams to take action in line with their unique profile.
  type: talk
  slides_url: null
  video_url: https://www.youtube.com/watch?v=Mxc7Ju8xK60
  recorded: true
- time_start: '14:00'
  time_end: '14:50'
  track: Talk - Other
  room: L2.85
  title: 'BTC as an IOC: Using Blockchain for Attribution'
  speakers:
  - name: Jackie Burns Koven
    company: null
    title: null
    bio: Jackie Burns Koven is the Head of Cyber Threat Intelligence at Chainalysis, leading the team that tracks cybercriminals
      and nation state actors stealing, scamming, and extorting cryptocurrency. She spends most of her time combing the blockchain
      for financial signatures of threat actors and mapping out the underground economy. She is a member of the Ransomware
      Task Force, which unites key stakeholders across industry, government, and civil society to innovate new solutions countering
      the ransomware threat. Prior to Chainalysis, she served in the U.S. Intelligence Community.
    photo: /img/archive/2023/speakers/jackie-burns-koven.webp
  description: Incident attribution is riddled with controversy and folly for even the most seasoned analysts. Leaked code,
    commodity malware, and the rapid rebranding of ransomware strains have further complicated the task. Blockchain intelligence
    can help visualize the underground ecosystem and attack kill chain, lending to unique financial footprints of specific
    threat actors or groups -- not to mention where scammed, extorted, or stolen funds go. This talk covers examples of how
    blockchain forensics can unmask ransomware rebrands and threat actors leveraging multiple monikers and crimes.
  type: talk
  slides_url: null
  video_url: null
  recorded: true
- time_start: '14:00'
  time_end: '14:50'
  track: Talk - Red
  room: L.63
  title: 'Hacking Serverless Applications: A Treasure Map for Uncharted Waters'
  speakers:
  - name: Matteo Rosi
    company: null
    title: null
    bio: Matteo Rosi, Security Researcher at Contrast Security, is a passionate cyber-security professional with 20 years
      of experience in the field. Prior to Contrast, he worked as Cyber Security Expert and SOC Manager at Telepass, helping
      organisations to design and implement all security capabilities and particularly the incident response process. Matteo
      holds a PhD in Computer Engineering from The University of Florence, the city where he lives with Corinna and their
      two sons. When Matteo isn't working hard at Contrast Security, you'll find him enjoying dying again and again in Elden
      Ring.
    photo: /img/archive/2023/speakers/matteo-rosi.webp
  description: 'Serverless technology eliminates the need for development teams to provision servers, passing the responsibility
    for some security threats to the cloud provider and freeing-up developers to concentrate on building logic and producing
    value quickly. But even without servers, serverless functions still execute code, which can lead to a cloud disaster,
    if not done right.


    In this talk, we will discuss common risks and challenges in serverless environments. I will introduce techniques used
    by attackers to exploit Serverless apps in unconventional ways. I will also demonstrate exploits of recently discovered
    CVE, targeting cloud functions.'
  type: talk
