# No trailing slash in urls
# Villages that have submitted the official BSidesNYC 2026 village form.
# More villages are on deck and will be added as their forms come in.
- title: "Ginger Hacking Initiative"
  url: "https://gingerhacker.org"
  logo: "ghi.webp"
  handson: false
  description: "The Ginger Hacking Initiative is a community-driven group working to build a welcoming, inclusive space for hackers to learn, share knowledge, and collaborate on hands-on security projects."
- title: "Raíces Cyber"
  url: "https://www.raicescyber.org"
  logo: "raices.webp"
  handson: false
  description: "Raíces Cyber's Mission is to Encourage and Support the Hispanic and Latino Cyber and Technology Community to Achieve Greater Representation in the World. We are doing that with our four main pillars. Continued Support and Encouragement to and from the Community, Education for all career levels, Access to valuable resources, Constructive Networking and the forming of STRONG bonds (“Roots”). "
- title: "Electronic Frontier Foundation"
  url: "https://www.eff.org"
  logo: "eff.svg"
  handson: false
  description: "The Electronic Frontier Foundation is the leading nonprofit defending civil liberties in the digital world. Founded in 1990, EFF champions user privacy, free expression, and innovation through litigation, policy analysis, grassroots activism, and technology development."
- title: "Women's Society of Cyberjutsu"
  url: "https://womenscyberjutsu.org"
  logo: "cyberjutsu.webp"
  handson: false
  description: "Women’s Society of Cyberjutsu (WSC) is a National 501(c)3 non-profit community, focused on empowering women to succeed in the cybersecurity industry. WSC’s mission is to advance women in cybersecurity careers by providing programs and partnerships that promote hands-on training, networking, education, mentoring, resource-sharing and other professional opportunities."
- title: "Cloud Village"
  url: "https://cloud-village.org"
  logo: "cloudvillage.webp"
  handson: true
  description: "Cloud Village is a place to meet folks interested in the offensive and defensive aspects of cloud security. The village hosts talks and a CTF of challenges focused on securing and attacking cloud platforms."
- title: "IoT Village"
  url: "https://www.iotvillage.org"
  logo: "iot.webp"
  handson: true
  description: "IoT Village advocates for advancing security in the Internet of Things (IoT) industry through bringing researchers and industry together. They'll have a hands-on activity for attendees and will be on hand to chat about IoT security."
- title: "John Jay Computer Science Society"
  url: "https://linktr.ee/css.jjay"
  logo: "jjcss.webp"
  handson: true
  description: "The Computer Science Society is the student-run computer science and technology club at CUNY John Jay College, giving students the skills, resources, and community to grow as leaders in STEM. They'll be running hands-on, laptop-based activities at their table throughout the day."
- title: "Blacks in Cybersecurity"
  url: "https://www.blacksincyberconf.com"
  logo: "bic.webp"
  handson: false
  description: "Blacks in Cybersecurity is a community-driven initiative working to build the pipeline of Black practitioners in cybersecurity through meetups, workshops, conferences, and CTF events. A returning BSidesNYC village, they'll be on hand to share resources and connect with attendees looking to grow in the field."
- title: "Red Team Village"
  url: "https://redteamvillage.io"
  logo: "rtv.webp"
  handson: true
  description: "Red Team Village builds a collaborative environment where security practitioners can develop and sharpen their offensive security skills. They'll have drop-in tactical demonstrations going throughout the day."
- title: "WiCyS NY Metro Affiliate"
  url: "https://www.wicys.org/wicys-ny-metro-affiliate"
  logo: "wicys2.webp"
  handson: true
  description: "The WiCyS NY Metro Affiliate is the New York City chapter of Women in CyberSecurity, a nonprofit dedicated to recruiting, retaining, and advancing women in the field. The chapter connects students and professionals across the metro area through networking, mentorship, and training, and will be offering a demo of games and educational storybooks that teach kids about cybersecurity at their table during the conference."
- title: "AI Security Village"
  url: "https://align-sec.org"
  logo: "aisecurityvillage.webp"
  handson: true
  description: "The AI Security Village is presented by Align, a community founded at Black Hat 2024 to empower and elevate women and non-binary individuals across the entire spectrum of AI security. The village pairs hands-on AI security exercises, a CTF, and talks with Align's work in advocacy, education, and mentorship. All are welcome!"
- title: "Script Kitty"
  url: "https://retia.io"
  logo: "scriptkitty.webp"
  handson: true
  description: "Script Kitty is a cat-themed learning space for beginner-friendly ethical hacking, run by Retia, a team of ethical hackers, media producers, and STEM student volunteers. They bring workshops and open-source kits covering soldering, Wi-Fi hacking, bad USB attacks, and LoRa hacking, with hands-on sessions running at the workshop tables throughout the day."
- title: "Lockpick Village by Lockpick Extreme"
  url: "https://lockpickextreme.com"
  logo: "lockpick.webp"
  handson: true
  description: "Lockpick Extreme has run lockpicking workshops and villages for over ten years, teaching thousands of people the fundamentals of physical security and locksport. Their village offers hands-on practice with picks and training locks, with an experienced instructor on hand to coach newcomers."
- title: "NYC Resistor"
  url: "https://www.nycresistor.com"
  logo: "nycresistor.webp"
  handson: false
  description: "NYC Resistor is a hacker collective with a shared space in downtown Brooklyn, meeting regularly to share knowledge, hack on projects together, and build community. A returning BSidesNYC village, they'll be on hand to talk about their space, their classes in electronics, soldering, and digital fabrication, and how to get involved in the local maker community."
