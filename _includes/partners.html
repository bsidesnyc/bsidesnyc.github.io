<!-- Begin Partners Section -->
{% if site.data.partners and site.data.partners.size > 0 %}
<section id="partners" class="sponsors sponsor-partners">
  <div class="content-wrapper">
    <div class="col-lg-10 offset-lg-1">
        <h4 class="text-center pt-4 pb-2">Partners</h4>
        <div class="row g-4 justify-content-center">
            {% for partner in site.data.partners %}
            <div class="col-12 col-sm-6 col-md-4">
                <div class="sponsor-logo-wrapper sponsor-logo-megabit">
                    <a href="{{ partner.link }}" target="_blank">
                        {% if partner.imageUrl %}
                        <img
                            src="{{ site.baseurl | append: '/img/sponsors/' | append: partner.imageUrl }}"
                            title="{{ partner.name }}"
                            alt="{{ partner.name }}"
                            loading="lazy"/>
                        {% else %}
                        <span class="partner-name">{{ partner.name }}</span>
                        {% endif %}
                        {% if partner.role %}<span class="partner-role">{{ partner.role }}</span>{% endif %}
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
  </div>
</section>
{% endif %}
<!-- End Partners Section -->
