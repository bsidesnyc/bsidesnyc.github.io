<!-- Begin Intro Section -->
<section id="top-section-hero" class="top-section-hero top-section image-section" style="{% include bg-image-style.html img=site.eventImage %}">
    {% include navigation.html %}
    <div class="overlay solid-overlay"></div>
    <div class="content-wrapper">
    <div class="jumbotron">
        <div class="animated hiding" data-animation="fadeInDown" data-delay="100">
          <div class="logo-intro">
            <img src="{{ site.baseurl | append: '/img' | append: site.logoImage }}" alt="BSidesNYC" fetchpriority="high">
          </div>
          <h3>{{ site.eventDate }}<p>at John Jay College of Criminal Justice</p></h3>
        </div>
        {% if site.introDayOfLinks %}
        <!-- Not animated, so they show at once on a slow connection -->
        <!-- a div, not <nav>: the slide-out menu's styles apply to every nav element -->
        <div class="intro-links" role="group" aria-label="Find your way" hidden>
            <a class="intro-link intro-link-primary intro-link-now" href="{{ site.baseurl }}/schedule/" hidden>What's on now</a>
            <a class="intro-link" href="{{ site.baseurl }}/schedule/">Schedule</a>
            <a class="intro-link" href="{{ site.baseurl }}/map/">Map</a>
        </div>
        <script>
            /*
             * Schedule/Map show from the day before to the day after the event,
             * "What's on now" on the day itself (New York time). Decided here in
             * the browser, so it stays right on a saved offline copy of the page.
             * ?now=YYYY-MM-DD... overrides the date for testing.
             */
            (function (eventDay) {
                const override = new URLSearchParams(location.search).get("now");
                const today = override ? override.slice(0, 10)
                    : new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
                const days = (Date.parse(today) - Date.parse(eventDay)) / 86400000;
                if (days < -1 || days > 1) return;
                document.querySelector(".intro-links").hidden = false;
                if (days === 0) document.querySelector(".intro-link-now").hidden = false;
            })("{{ site.eventStartTime | slice: 0, 10 }}");
        </script>
        {% endif %}
    </div>
    </div>
</section>
<!-- End Intro Section -->
