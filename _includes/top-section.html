<!-- Begin Top Section -->
<section id="top-section" class="top-section image-section {% if page.image %}enable-overlay{% endif %}{% if page.mobileHero == false %} no-mobile-hero{% endif %}" style="{% if page.image %}{% include bg-image-style.html img=page.image %}{% elsif page.color %}background: {{ page.color }} {% else %} background: #bebbbb {% endif %}">
    <!--<div class="overlay gradient-overlay"></div>-->
    <div class="overlay solid-overlay"></div>
    {% include navigation.html %}
	<div class="content-wrapper">
	    <div class="jumbotron text-start">
	        <div class="animated hiding" data-animation="fadeInLeft" data-delay="0">
	            <h1>{{ page.title }}</h1>
	        </div>
	    </div>
    </div>
</section>
<!-- End Top Section -->
